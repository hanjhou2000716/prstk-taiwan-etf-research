name: Deploy report to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate publish inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              Path('site/data/manifest.json'),
              Path('site/data/strategy-catalog.json'),
              Path('site/data/reconciliation_report.json'),
              Path('site/lpos-portfolio-lab/research/v3_observed_snapshots.json'),
          ]
          for path in required:
              json.loads(path.read_text(encoding='utf-8'))
              print('valid JSON:', path)
          research=json.loads(Path('site/lpos-portfolio-lab/research/v3_observed_snapshots.json').read_text(encoding='utf-8'))
          assert research['webVersion']=='0.2.0' and len(research['cases'])==10 and research['marketData']['tradeSessions']==1366
          assert research['sourceGrade']=='B_VENDOR_PLUS_MIXED_PAYOUTS' and research['loanRenewalVerified'] is False
          pages = ['index.html','composer.html','research-lab.html','beta-lab.html','leverage-lab.html','financing-lab.html','risk-lab.html','sensitivity.html','compare.html','stress-test.html','report.html']
          for name in pages:
              text = Path('site', name).read_text(encoding='utf-8')
              if '</html>' in text and text.split('</html>', 1)[1].strip():
                  raise SystemExit(f'invalid trailing content after </html>: {name}')
          PY
      - name: Validate publish contract
        run: python scripts/validate_publish_contract.py
      - name: Independently validate LPOS Web V0.3 on archived published adjusted-price paths
        run: node scripts/lpos_v03_validate.mjs
      - name: Write deployment metadata
        env:
          SITE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          manifest=json.loads(Path('site/data/manifest.json').read_text(encoding='utf-8'))
          model=json.loads(Path('site/data/model-config.json').read_text(encoding='utf-8'))
          payload={
              'commit_sha': '${{ github.sha }}',
              'data_end_date': manifest.get('data_end_date'),
              'model_version': model.get('model_version') or manifest.get('model_version'),
              'deployed_at': datetime.now(timezone.utc).isoformat()
          }
          Path('site/data/deployment.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - run: |
          mkdir -p artifacts/reports
          mkdir -p artifacts/reports/assets
          mkdir -p artifacts/reports/lpos-portfolio-lab
          cp -r site/lpos-portfolio-lab/. artifacts/reports/lpos-portfolio-lab/
          cp site/index.html artifacts/reports/index.html
          cp site/composer.html artifacts/reports/composer.html
          cp site/research-lab.html artifacts/reports/research-lab.html
          cp site/beta-lab.html artifacts/reports/beta-lab.html
          cp site/leverage-lab.html artifacts/reports/leverage-lab.html
          cp site/financing-lab.html artifacts/reports/financing-lab.html
          cp site/risk-lab.html artifacts/reports/risk-lab.html
          cp site/strategies.html artifacts/reports/strategies.html
          cp site/compare.html artifacts/reports/compare.html
          cp site/stress-test.html artifacts/reports/stress-test.html
          cp site/sensitivity.html artifacts/reports/sensitivity.html
          cp site/methodology.html artifacts/reports/methodology.html
          cp site/proposal.html artifacts/reports/proposal.html
          cp site/audit.html artifacts/reports/audit.html
          cp site/dashboard.html artifacts/reports/dashboard.html
          cp site/horizons.html artifacts/reports/horizons.html
          cp site/builder.html artifacts/reports/builder.html
          cp site/styles.css artifacts/reports/styles.css
          cp -r site/styles artifacts/reports/styles
          cp -r site/js artifacts/reports/js
          cp site/assets/*.png artifacts/reports/assets/
          cp site/report.html artifacts/reports/report.html
          cp -r site/data artifacts/reports/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: artifacts/reports}
      - uses: actions/deploy-pages@v4
      - name: Smoke test published site
        run: |
          set -euo pipefail
          base="https://hanjhou2000716.github.io/prstk-taiwan-etf-research"
          for path in index.html lpos-portfolio-lab/index.html lpos-portfolio-lab/research/v3_observed_snapshots.json composer.html research-lab.html beta-lab.html leverage-lab.html financing-lab.html risk-lab.html sensitivity.html compare.html stress-test.html report.html styles/design-system.css data/manifest.json data/backtests/buy_hold_006208.csv; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' "$base/$path")
            test "$code" = "200"
          done
          curl -fLsS --retry 6 --retry-all-errors --retry-delay 3 "$base/lpos-portfolio-lab/index.html" -o /tmp/lpos-portfolio-lab.html
          grep -q "LPOS Portfolio Lab" /tmp/lpos-portfolio-lab.html
          grep -q "Web V0.3" /tmp/lpos-portfolio-lab.html
          grep -q "function runDynamicBacktest" /tmp/lpos-portfolio-lab.html
          for symbol in 006208 00631L 00685L; do
            test "$(curl -L -sS -o /dev/null -w '%{http_code}' "$base/data/backtests/buy_hold_${symbol}.csv")" = 200
          done
          grep -q "v3_observed_snapshots.json" /tmp/lpos-portfolio-lab.html
          echo "LPOS Portfolio Lab publicly accessible with expected HTML"
          python - <<'PY'
          import json, urllib.request
          base='https://hanjhou2000716.github.io/prstk-taiwan-etf-research'
          from urllib.request import urlopen
          bridge=json.load(urlopen(base+'/lpos-portfolio-lab/research/v3_observed_snapshots.json'))
          assert bridge['webVersion']=='0.2.0' and len(bridge['cases'])==10
          assert bridge['marketData']['tradeSessions']==1366
          assert bridge['loanRenewalVerified'] is False
          assert bridge['marketData']['officialRawDailyRowsArchived']==0
          print('LPOS V0.2 research JSON publicly verified:', len(bridge['cases']), 'cases')
          meta=json.load(urllib.request.urlopen(base+'/data/deployment.json'))
          expected='${{ github.sha }}'
          assert meta['commit_sha'] == expected, (meta, expected)
          print('published commit verified:', meta['commit_sha'])
          PY
