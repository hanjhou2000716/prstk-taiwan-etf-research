name: Research pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m prstk_research.pipeline run --download
      - uses: actions/upload-artifact@v4
        with:
          name: prstk-research-artifacts
          path: artifacts/
      - name: Sync generated data into site snapshot
        run: |
          cp artifacts/validation/reconciliation_report.json site/data/reconciliation_report.json
          cp artifacts/validation/corporate_actions.json site/data/corporate_actions.json
          cp artifacts/manifests/manifest.json site/data/manifest.json
          cp artifacts/metrics/baseline_metrics.json site/data/baseline_metrics.json
          cp artifacts/metrics/horizon_metrics.json site/data/horizon_metrics.json
          cp artifacts/metrics/financing_model.json site/data/financing_model.json
          cp artifacts/metrics/strategy_events.json site/data/strategy_events.json
          cp artifacts/backtests/*.csv site/data/backtests/
      - name: Commit refreshed site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No site data changes"
          else
            git commit -m "chore: refresh research data"
            git push
          fi
