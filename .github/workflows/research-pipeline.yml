name: Research pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m prstk_research.pipeline run --download
      - uses: actions/upload-artifact@v4
        with:
          name: prstk-research-artifacts
          path: artifacts/
      - name: Prepare interactive Pages site
        run: |
          mkdir -p pages/data/backtests
          cp site/index.html pages/index.html
          cp site/proposal.html pages/proposal.html
          cp site/dashboard.html pages/dashboard.html
          cp site/horizons.html pages/horizons.html
          cp artifacts/reports/research_report.html pages/report.html
          cp site/builder.html pages/builder.html
          cp artifacts/metrics/baseline_metrics.json pages/data/baseline_metrics.json
          cp artifacts/metrics/horizon_metrics.json pages/data/horizon_metrics.json
          cp artifacts/metrics/financing_model.json pages/data/financing_model.json
          cp artifacts/metrics/strategy_events.json pages/data/strategy_events.json
          cp artifacts/backtests/*.csv pages/data/backtests/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
