name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: python -m pip install pytest==8.3.4 pypdf==6.1.3 pymupdf==1.26.5 fonttools==4.67.0
      - run: python -m pytest --basetemp /tmp/prstk-pytest
      - name: Validate site contracts
        run: python scripts/validate_site.py
      - name: Validate publish contract
        run: python scripts/validate_publish_contract.py
      - name: Validate research contracts
        run: python scripts/validate_research_contracts.py
      - name: Check JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find site/js -name '*.js' -type f)
      - name: Run frontend financial fixtures
        run: node --test tests/*.test.mjs
      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run responsive visual smoke
        run: node scripts/visual_smoke.mjs
      - name: LPOS V0.1 through V0.6 regression
        run: |
          node scripts/lpos_v03_validate.mjs
          node scripts/lpos_v05_validate.mjs
          node scripts/lpos_v05_ui_smoke.mjs
          node scripts/lpos_v06_browser_smoke.mjs
      - name: Type check and build LPOS V0.7
        run: |
          npm run fonts:lpos
          npm run typecheck
          npm run build:lpos
      - name: LPOS V0.7 financial, report, and replay checks
        run: |
          npm run test:lpos
          node scripts/lpos_v07_browser_smoke.mjs
          python scripts/lpos_v07_pdf_check.py artifacts/lpos-v07/representative-report.pdf
      - name: Upload responsive smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prstk-responsive-smoke
          path: |
            artifacts/ui-smoke
            artifacts/lpos-v07
