name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest
      - run: python -m pytest
      - name: Validate site contracts
        run: python scripts/validate_site.py
      - name: Validate publish contract
        run: python scripts/validate_publish_contract.py
      - name: Validate research contracts
        run: python scripts/validate_research_contracts.py
      - name: Check JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find site/js -name '*.js' -type f)
      - name: Run frontend financial fixtures
        run: node --test tests/*.test.mjs
      - name: Install browser smoke dependencies
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive visual smoke
        run: node scripts/visual_smoke.mjs
      - name: Upload responsive smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prstk-responsive-smoke
          path: artifacts/ui-smoke
