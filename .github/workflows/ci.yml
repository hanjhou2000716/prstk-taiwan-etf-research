name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest
      - run: python -m pytest
      - name: Validate site contracts
        run: python scripts/validate_site.py
      - name: Check JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find site/js -name '*.js' -type f)
      - name: Run frontend financial fixtures
        run: node --test tests/frontend_metrics.test.mjs tests/portfolio_engine.test.mjs tests/risk_engine.test.mjs
