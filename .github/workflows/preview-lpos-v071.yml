name: LPOS V0.7.1 isolated preview
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full current commit SHA of PR 68 (no production merge)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'hanjhou2000716/prstk-taiwan-etf-research'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      production_sha: ${{ steps.identity.outputs.production_sha }}
      production_metadata_sha: ${{ steps.identity.outputs.production_metadata_sha }}
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
    steps:
      - name: Verify immutable candidate and capture actual public production identity
        id: identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, urllib.request
          from pathlib import Path
          candidate=os.environ['CANDIDATE_SHA']
          assert re.fullmatch('[0-9a-f]{40}',candidate), 'A full immutable SHA is required'
          repo='hanjhou2000716/prstk-taiwan-etf-research'
          request=urllib.request.Request(f'https://api.github.com/repos/{repo}/pulls/68',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          pr=json.load(urllib.request.urlopen(request))
          assert pr['state']=='open' and not pr['merged'] and pr['base']['ref']=='main'
          assert pr['head']['repo']['full_name']==repo and pr['head']['sha']==candidate, 'Candidate must be the current head of PR 68'
          with urllib.request.urlopen('https://hanjhou2000716.github.io/prstk-taiwan-etf-research/data/deployment.json') as response:
              metadata=response.read()
          production=json.loads(metadata)
          assert re.fullmatch('[0-9a-f]{40}',production['commit_sha'])
          Path('release-inputs').mkdir()
          Path('release-inputs/production.json').write_bytes(metadata)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f"candidate_sha={candidate}\nproduction_sha={production['commit_sha']}\nproduction_metadata_sha={hashlib.sha256(metadata).hexdigest()}\n")
          print('Candidate:',candidate,'Preserved production:',production['commit_sha'])
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.production_sha }}
          path: production
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest==8.3.4 pypdf==6.1.3 pymupdf==1.26.5 fonttools==4.67.0
      - name: Verify and build the candidate at its isolated path
        working-directory: candidate
        env:
          LPOS_BASE_PATH: /prstk-taiwan-etf-research/lpos-portfolio-lab/preview/v071/
          VITE_DATA_BASE_URL: /prstk-taiwan-etf-research/lpos-portfolio-lab/preview/v071/data/
        run: |
          npm ci
          python -m pytest --basetemp /tmp/prstk-preview-pytest
          npm run fonts:lpos
          npm run typecheck
          npm test
          npm run build:lpos
          npx playwright install --with-deps chromium firefox webkit
      - name: Rebuild the exact production source version
        working-directory: production
        run: |
          npm ci
          npm run fonts:lpos
          npm run build:lpos
      - name: Compare all production files with the public site before adding the preview
        run: |
          python tooling/scripts/lpos_preview_release.py \
            --production-site production/site --production-build production/apps/lpos/dist \
            --candidate-build candidate/apps/lpos/dist --candidate-data candidate/site/data \
            --metadata release-inputs/production.json --candidate-sha '${{ steps.identity.outputs.candidate_sha }}' \
            --output artifacts/reports --evidence candidate/artifacts/lpos-v07/production-preservation.json
      - name: Test the exact candidate artifact in three browser engines
        working-directory: candidate
        env:
          LPOS_STATIC_ROOT: ${{ github.workspace }}/artifacts/reports
          LPOS_APP_PATH: lpos-portfolio-lab/preview/v071/
        run: |
          node scripts/lpos_v07_browser_smoke.mjs
          python scripts/lpos_v07_pdf_check.py artifacts/lpos-v07/representative-report.pdf
      - uses: actions/upload-pages-artifact@v3
        with: {path: artifacts/reports}
      - name: Save preservation, browser, and PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lpos-v071-preview-evidence
          path: candidate/artifacts/lpos-v07
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject publication if production changed during validation
        env:
          EXPECTED_METADATA_SHA: ${{ needs.prepare.outputs.production_metadata_sha }}
        run: |
          python - <<'PY'
          import hashlib, os, urllib.request
          with urllib.request.urlopen('https://hanjhou2000716.github.io/prstk-taiwan-etf-research/data/deployment.json') as response:
              assert hashlib.sha256(response.read()).hexdigest()==os.environ['EXPECTED_METADATA_SHA'], 'Production changed; rebuild the preview artifact'
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-public:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: tooling, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.prepare.outputs.candidate_sha }}', path: candidate, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: lpos-v071-preview-evidence, path: verification-evidence}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify public release identities and preserved production contents
        env:
          EXPECTED_CANDIDATE: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'tooling')
          from scripts.lpos_preview_release import read_public, verify_public_hashes
          evidence=json.loads(Path('verification-evidence/production-preservation.json').read_text())
          actual=json.loads(read_public('lpos-portfolio-lab/preview/v071/version.json'))
          assert actual==evidence['identity'] and actual['candidate_commit']==os.environ['EXPECTED_CANDIDATE']
          verify_public_hashes(evidence['production_files'])
          print('Public preview and unchanged production files verified:',actual)
          PY
      - name: Verify public user flows and downloadable PDF
        working-directory: candidate
        env:
          LPOS_BASE_URL: https://hanjhou2000716.github.io/prstk-taiwan-etf-research
          LPOS_APP_PATH: lpos-portfolio-lab/preview/v071/
        run: |
          npm ci
          python -m pip install pypdf==6.1.3 pymupdf==1.26.5
          npx playwright install --with-deps chromium firefox webkit
          node scripts/lpos_v07_browser_smoke.mjs
          python scripts/lpos_v07_pdf_check.py artifacts/lpos-v07/representative-report.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lpos-v071-public-evidence
          path: candidate/artifacts/lpos-v07
