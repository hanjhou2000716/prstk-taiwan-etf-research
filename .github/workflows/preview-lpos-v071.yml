name: LPOS V0.7.1 isolated preview
on:
  push:
    branches: [feature/lpos-v071]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the current production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Check out the V0.7.1 candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install and verify candidate
        working-directory: candidate
        env:
          LPOS_BASE_PATH: /prstk-taiwan-etf-research/lpos-portfolio-lab/preview/v071/
          VITE_DATA_BASE_URL: /prstk-taiwan-etf-research/data/
        run: |
          npm ci
          python -m pip install pytest==8.3.4 pypdf==6.1.3 pymupdf==1.26.5 fonttools==4.67.0
          python -m pytest --basetemp /tmp/prstk-pytest
          npm run fonts:lpos
          npm run typecheck
          npm test
          npm run build:lpos
      - name: Install browser engines
        working-directory: candidate
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Assemble the unchanged production site and isolated preview
        run: |
          set -euo pipefail
          mkdir -p artifacts/reports
          cp -r baseline/site/. artifacts/reports/
          mkdir -p artifacts/reports/lpos-portfolio-lab/preview/v071
          cp -r candidate/apps/lpos/dist/. artifacts/reports/lpos-portfolio-lab/preview/v071/
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          candidate=subprocess.check_output(['git','-C','candidate','rev-parse','HEAD'],text=True).strip()
          baseline=subprocess.check_output(['git','-C','baseline','rev-parse','HEAD'],text=True).strip()
          Path('artifacts/reports/lpos-portfolio-lab/preview/v071/version.json').write_text(json.dumps({'app_version':'0.7.1','candidate_commit':candidate,'production_site_commit':baseline},indent=2),encoding='utf-8')
          PY
      - name: Verify the exact preview artifact in desktop and mobile browsers
        env:
          LPOS_STATIC_ROOT: artifacts/reports
          LPOS_APP_PATH: lpos-portfolio-lab/preview/v071/
        run: |
          node candidate/scripts/lpos_v07_browser_smoke.mjs
          python candidate/scripts/lpos_v07_pdf_check.py artifacts/lpos-v07/representative-report.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/reports
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public isolated preview and its release identity
        env:
          LPOS_BASE_URL: https://hanjhou2000716.github.io/prstk-taiwan-etf-research
          LPOS_APP_PATH: lpos-portfolio-lab/preview/v071/
        run: |
          set -euo pipefail
          url="$LPOS_BASE_URL/lpos-portfolio-lab/preview/v071"
          curl -fLsS --retry 6 --retry-all-errors --retry-delay 3 "$url/index.html" -o /tmp/lpos-v071-preview.html
          grep -q 'assets-v07/' /tmp/lpos-v071-preview.html
          curl -fLsS --retry 6 --retry-all-errors --retry-delay 3 "$url/version.json" -o /tmp/lpos-v071-preview-version.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/lpos-v071-preview-version.json').read_text())
          assert data['app_version']=='0.7.1', data
          assert len(data['candidate_commit'])==40 and len(data['production_site_commit'])==40, data
          print('preview verified:', data)
          PY
          node candidate/scripts/lpos_v07_browser_smoke.mjs
          python candidate/scripts/lpos_v07_pdf_check.py artifacts/lpos-v07/representative-report.pdf
      - name: Upload preview browser, screenshot, and PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lpos-v071-preview-evidence
          path: artifacts/lpos-v07
