<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRStK 參數敏感度</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="site-shell header-inner"><a class="brand-pair" href="index.html" aria-label="PRStK 與 SFC.e 台灣 ETF 研究平台"><img src="assets/PRStK-Remove.png" alt="PRStK" class="brand-logo"><span class="brand-divider">|</span><img src="assets/SFC.e-removebg-preview.png" alt="SFC.e" class="brand-logo"><span class="brand-platform-name">Taiwan ETF Quantitative Research Platform</span></a><nav class="nav" aria-label="主選單"><a href="index.html">總覽</a><a href="research-lab.html">研究實驗室</a><a href="strategies.html">策略資料庫</a><a href="compare.html">策略比較</a><a href="stress-test.html">壓力測試</a><a href="report.html">研究報告</a><a class="active" href="sensitivity.html">敏感度分析</a><a href="audit.html">研究審核</a></nav></div></header><main class="site-shell"><div class="breadcrumb"><a href="index.html">總覽</a><span>/</span><span>敏感度分析</span></div><section class="hero"><p class="eyebrow">Parameter Sensitivity</p><h1 class="display">不要只找最佳參數，也要看穩定區域。</h1><p class="lead">目前以年度成本與無風險利率做雙參數敏感度；每格重新使用共用指標引擎。</p></section><section class="section"><div class="form-card"><div class="field"><label for="strategy">策略</label><select id="strategy"></select></div><button class="button" id="run">更新敏感度</button></div></section><section class="section"><div class="section-title"><h2>CAGR 敏感度</h2><p>列：年度成本；欄：無風險利率</p></div><div id="heatmap" class="chart chart-svg"></div></section><footer class="footer">@2026 PRStK Lab &amp; SFC.e. | All right reserved.</footer></main><script type="module">import{parseCsv}from'./js/core/date-alignment.js';import{calculateMetrics}from'./js/core/metrics.js';import{heatmap}from'./js/charts/svg-charts.js';const catalog=await fetch('data/strategy-catalog.json').then(r=>r.json()),sel=document.querySelector('#strategy');catalog.strategies.forEach(s=>{const o=document.createElement('option');o.value=s.strategy_id;o.textContent=s.display_name;sel.appendChild(o)});const data={};for(const s of catalog.strategies){const r=await fetch(`data/backtests/${s.strategy_id}.csv`);if(r.ok)data[s.strategy_id]=parseCsv(await r.text()).map(x=>({date:x.date,nav:Number(x.nav)}))}function run(){const costs=[0,.01,.02,.03,.04,.05],rfs=[0,.01,.02,.03,.04],rows=costs.map(cost=>rfs.map(rf=>calculateMetrics(data[sel.value],{riskFreeRate:rf,annualCost:cost}).cagr));heatmap('#heatmap',rows,{labels:costs.map(x=>`成本 ${(x*100).toFixed(0)}%`),columns:rfs.map(x=>`RF ${(x*100).toFixed(0)}%`),height:300})}document.querySelector('#run').addEventListener('click',run);run();</script></body></html>
