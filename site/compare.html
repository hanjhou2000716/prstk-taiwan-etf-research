<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>策略比較｜PRStK</title><link rel="stylesheet" href="styles/design-system.css?v=20260808-ds2"></head><body>
<header class="site-header" data-site-header></header>
<main class="site-shell"><div class="breadcrumb"><a href="index.html">研究總覽</a><span>/</span><span>策略比較</span></div><section class="hero"><p class="eyebrow">Strategy Compare</p><h1 class="display">在同一期間理解策略差異</h1><p class="lead">公平比較模式使用所選策略的共同交易日；完整歷史模式保留各自資料範圍，但不建立單一排名。</p></section><section class="section"><div class="form-card"><div class="grid-2"><div class="field"><label for="period">比較期間</label><select id="period"><option value="all">全部可用期間</option><option value="20">20 年</option><option value="10">10 年</option><option value="5">5 年</option><option value="3">3 年</option><option value="1">1 年</option></select></div><div class="field"><label for="comparisonMode">日期口徑</label><select id="comparisonMode"><option value="common_period">公平比較：共同日期</option><option value="full_available">完整歷史：各自日期</option></select></div></div><div id="choices" class="strategy-list" style="margin-top:16px"></div><div class="toolbar" style="margin-top:16px"><button class="button" id="run" type="button">重新比較</button><button class="button secondary" id="export" type="button">匯出 JSON</button><select id="sort" aria-label="排序指標"><option value="">排序指標</option><option value="cagr">CAGR 高到低</option><option value="vol">波動率 低到高</option><option value="sharpe">Sharpe 高到低</option><option value="drawdown">最大回撤接近零</option></select></div></div></section><section class="section"><div id="status" class="note" aria-live="polite">正在載入策略……</div><div class="table-wrap"><table class="data-table"><thead><tr><th>策略</th><th>狀態</th><th>起始日</th><th>結束日</th><th>觀測值</th><th>CAGR</th><th>波動率</th><th>Sharpe</th><th>最大回撤</th><th>期末 NAV</th></tr></thead><tbody id="table"><tr><td colspan="10">尚未執行比較。</td></tr></tbody></table></div></section><section class="section"><div class="section-title"><h2>策略報酬相關性</h2><p>相關係數使用各策略共同存在的每日報酬觀測值。</p></div><div class="table-wrap"><table class="data-table"><thead id="corrHead"></thead><tbody id="corrBody"></tbody></table></div></section><footer class="footer">@2026 PRStK Lab &amp; SFC.e. |
