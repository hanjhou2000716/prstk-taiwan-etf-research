<section class="hero"><p class="eyebrow">Compare</p><h1 class="display">用相同資料口徑比較策略。</h1><p class="lead">公平比較模式會先取所選策略的共同交易日期，再切出指定視窗；完整歷史模式只展示各自結果，不產生單一排名。</p></section>
<section class="section"><div class="form-card"><div class="field"><label for="period">比較期間</label><select id="period"><option value="all">完整共同期間</option><option value="20">近 20 年</option><option value="10">近 10 年</option><option value="5">近 5 年</option><option value="3">近 3 年</option><option value="1">近 1 年</option></select></div><div class="field"><label for="comparisonMode">比較口徑</label><select id="comparisonMode"><option value="common_period">公平比較：共同日期</option><option value="full_available">完整歷史：各自期間</option></select></div><div id="choices" class="strategy-list"></div><div class="toolbar"><button class="button" id="run">更新比較</button><button class="button secondary" id="export">匯出比較結果</button><select id="sort" aria-label="排序指標"><option value="">排序指標</option><option value="cagr">CAGR 由高至低</option><option value="vol">波動由低至高</option><option value="sharpe">Sharpe 由高至低</option><option value="drawdown">最大回撤較小至大</option></select></div></div></section>
<section class="section"><div id="status" class="note" aria-live="polite">選擇策略後更新。</div><div class="table-wrap"><table class="data-table"><thead><tr><th>策略</th><th>狀態</th><th>起始日</th><th>結束日</th><th>觀測數</th><th>CAGR</th><th>波動</th><th>Sharpe</th><th>最大回撤</th><th>期末 NAV</th></tr></thead><tbody id="table"><tr><td colspan="10">選擇策略後更新。</td></tr></tbody></table></div></section>
<section class="section"><div class="section-title"><h2>每日報酬相關性</h2><p>只對共同日期計算</p></div><div class="table-wrap"><table class="data-table"><thead id="corrHead"></thead><tbody id="corrBody"></tbody></table></div></section>
