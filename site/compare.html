<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRStK 策略比較</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="site-shell header-inner"><a class="brand-pair" href="index.html" aria-label="PRStK 與 SFC.e 台灣 ETF 研究平台"><img src="assets/PRStK-Remove.png" alt="PRStK" class="brand-logo"><span class="brand-divider">|</span><img src="assets/SFC.e-removebg-preview.png" alt="SFC.e" class="brand-logo"><span class="brand-platform-name">Taiwan ETF Quantitative Research Platform</span></a><nav class="nav" aria-label="主選單"><a href="index.html">總覽</a><a href="research-lab.html">研究實驗室</a><a href="strategies.html">策略資料庫</a><a class="active" href="compare.html">策略比較</a><a href="stress-test.html">壓力測試</a><a href="report.html">研究報告</a><a href="methodology.html">資料與方法</a><a href="audit.html">研究審核</a></nav></div></header><main class="site-shell"><div class="breadcrumb"><a href="index.html">總覽</a><span>/</span><span>策略比較</span></div><section class="hero"><p class="eyebrow">Compare</p><h1 class="display">用同一期間、同一指標比較策略。</h1><p class="lead">預設採共同可用期間；選擇各自完整資料時，起始日不同的限制會明確顯示。</p></section><section class="section"><div class="form-card"><div class="field"><label for="period">比較期間</label><select id="period"><option value="all">完整共同期間</option><option value="5">近 5 年</option><option value="3">近 3 年</option><option value="1">近 1 年</option></select></div><div id="choices" class="strategy-list"></div><button class="button" id="run">更新比較</button></div></section><section class="section"><div class="table-wrap"><table class="data-table"><thead><tr><th>策略</th><th>CAGR</th><th>波動</th><th>Sharpe</th><th>Sortino</th><th>最大回撤</th><th>期末 NAV</th></tr></thead><tbody id="table"><tr><td colspan="7">選擇策略後更新。</td></tr></tbody></table></div></section><footer class="footer">@2026 PRStK Lab &amp; SFC.e. | All right reserved.</footer></main><script type="module">import{parseCsv}from './js/core/date-alignment.js';import{calculateMetrics,formatMetric}from './js/core/metrics.js';const catalog=await fetch('data/strategy-catalog.json').then(r=>r.json());const files=Object.fromEntries(catalog.strategies.map(s=>[s.strategy_id,`data/backtests/${s.strategy_id}.csv`]));const data={};for(const[k,u]of Object.entries(files)){const r=await fetch(u);if(r.ok)data[k]=parseCsv(await r.text()).map(x=>({date:x.date,nav:Number(x.nav)}))}const box=document.querySelector('#choices');catalog.strategies.forEach((s,i)=>{const l=document.createElement('label');l.className='strategy-row';l.innerHTML=`<input type="checkbox" data-id="${s.strategy_id}" ${i<3?'checked':''}><span class="strategy-name">${s.display_name}</span>`;box.appendChild(l)});const pct=x=>formatMetric(x,'percent');function run(){const days=Number(document.querySelector('#period').value)||0;const selected=[...document.querySelectorAll('#choices input:checked')].map(x=>x.dataset.id);document.querySelector('#table').innerHTML=selected.map(id=>{let rows=data[id]||[];if(days&&rows.length>days*252+1)rows=rows.slice(-(days*252+1));const m=calculateMetrics(rows);return`<tr><td>${catalog.strategies.find(s=>s.strategy_id===id).display_name}</td><td>${pct(m.cagr)}</td><td>${pct(m.annualizedVolatility)}</td><td>${m.sharpe?.toFixed(2)||'—'}</td><td>${m.sortino?.toFixed(2)||'—'}</td><td>${pct(m.maxDrawdown)}</td><td>${m.endingWealth?.toFixed(2)||'—'}</td></tr>`}).join('')||'<tr><td colspan="7">尚未選擇策略。</td></tr>'}document.querySelector('#run').addEventListener('click',run);run();</script></body></html>
