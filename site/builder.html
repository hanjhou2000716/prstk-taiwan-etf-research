<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRStK Strategy Builder</title>
<style>body{font-family:system-ui,'Noto Sans TC',sans-serif;max-width:1100px;margin:auto;padding:24px;background:#f3f7fb;color:#172033}header,section,aside{background:#fff;border:1px solid #dbe4ee;border-radius:14px;padding:18px;margin-bottom:16px}header{background:#082f49;color:#fff}a{color:#bae6fd}h1,h2{color:#075985}header h1{color:#fff}main{display:grid;grid-template-columns:290px 1fr;gap:16px}label{display:block;color:#64748b;font-size:13px;margin:12px 0 5px}select,input,button{width:100%;padding:9px;border:1px solid #b9c8d8;border-radius:8px;background:#fff;font:inherit}button{background:#0284c7;color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{color:#64748b}.metric strong{display:block;font-size:22px;color:#172033}.chart{height:320px}.chart canvas{width:100%;height:100%}.table{width:100%;border-collapse:collapse}.table td{padding:8px;border-bottom:1px solid #dbe4ee}.hint{font-size:12px;color:#64748b}@media(max-width:800px){main{display:block}.cards{grid-template-columns:repeat(2,1fr)}}</style>
<header><a href="index.html">PRStK Research Platform</a><h1>自組策略建構器</h1><div>調整資產、權重、槓桿與 200MA 訊號，在瀏覽器內重算。</div></header>
<main><aside><h2>策略設定</h2><label>第一資產</label><select id="a"><option value="006208">006208 原型</option><option value="00685L">00685L 正二</option><option value="00631L">00631L 正二</option><option value="synthetic_2x_proxy_00685L">20年合成正二代理</option><option value="synthetic_2x_proxy_00631L">20年台灣50正二代理</option></select><label>第一資產權重 <span id="awv">50%</span></label><input id="aw" type="range" min="0" max="200" value="50"><label>第二資產</label><select id="b"><option value="cash">現金</option><option value="006208">006208 原型</option><option value="00685L">00685L 正二</option><option value="00631L">00631L 正二</option><option value="synthetic_2x_proxy_00685L">20年合成正二代理</option><option value="synthetic_2x_proxy_00631L">20年台灣50正二代理</option></select><label>第二資產權重 <span id="bwv">50%</span></label><input id="bw" type="range" min="0" max="200" value="50"><label>額外槓桿 <span id="levv">1.00x</span></label><input id="lev" type="range" min="0" max="300" value="100"><label>訊號過濾</label><select id="filter"><option value="none">不過濾</option><option value="ma200">第一資產高於 200MA 才持有</option></select><label>回測視窗</label><select id="window"><option value="all">完整資料</option><option value="20">20 年</option><option value="10">10 年</option><option value="5">5 年</option><option value="3">3 年</option><option value="1">1 年</option></select><button id="run">執行自組回測</button><p class="hint">現金日報酬設為 0%。權重可超過 100% 以測試融資曝險；這是研究模擬，不是下單指令。</p></aside>
<section><h2 id="title">自組策略</h2><div class="cards"><div class="metric">累積報酬<strong id="ret">-</strong></div><div class="metric">年化報酬<strong id="ann">-</strong></div><div class="metric">年化波動<strong id="vol">-</strong></div><div class="metric">最大回撤<strong id="dd">-</strong></div></div><p id="status" class="hint">讀取資料中</p><div class="chart"><canvas id="chart"></canvas></div><p id="formula" class="hint"></p><table class="table" id="table"></table><p class="hint">20 年合成代理：以 TWSE 0050 調整後價格的每日報酬乘 2、每日重置；不等同真實 ETF 費用、追蹤差、配息、稅與流動性。</p></section></main>
<script>
const FILES={"006208":"data/backtests/buy_hold_006208.csv","00685L":"data/backtests/buy_hold_00685L.csv","00631L":"data/backtests/buy_hold_00631L.csv","synthetic_2x_proxy_00685L":"data/backtests/synthetic_2x_proxy_00685L.csv","synthetic_2x_proxy_00631L":"data/backtests/synthetic_2x_proxy_00631L.csv"};
const data={},$=id=>document.getElementById(id),pct=x=>x==null?"-":(x*100).toFixed(2)+"%";
async function load(){for(const [key,url] of Object.entries(FILES)){const r=await fetch(url);if(!r.ok)continue;const lines=(await r.text()).trim().split(/\r?\n/);data[key]=lines.slice(1).map(line=>{const p=line.split(",");return{date:p[0],nav:Number(p[2])}})}$("status").textContent=Object.keys(data).length+" 組資料已載入";run()}
function rowsForWindow(rows){const n=$("window").value;if(n==="all")return rows;const days=Number(n)*252;return rows.length>days?rows.slice(-(days+1)):rows}
function build(){const a=$("a").value,b=$("b").value,aw=Number($("aw").value)/100,bw=Number($("bw").value)/100,lev=Number($("lev").value)/100,base=data[a];if(!base)return[];const other=b==="cash"?new Map():new Map((data[b]||[]).map(x=>[x.date,x.nav]));let nav=1,out=[];for(let i=0;i<base.length;i++){if(i&&other.has(base[i].date)){const ra=base[i].nav/base[i-1].nav-1,prev=other.get(base[i-1].date),rb=prev?other.get(base[i].date)/prev-1:0;let weight=aw;if($("filter").value==="ma200"&&i>=200){let sum=0;for(let j=i-200;j<i;j++)sum+=base[j].nav;weight=base[i-1].nav>sum/200?aw:0}nav*=Math.max(.000001,1+lev*(weight*ra+bw*rb))}else if(i)nav*=Math.max(.000001,1+lev*aw*(base[i].nav/base[i-1].nav-1));out.push({date:base[i].date,nav})}return rowsForWindow(out)}
function metrics(rows){if(rows.length<2)return null;const rets=rows.slice(1).map((x,i)=>x.nav/rows[i].nav-1),growth=rows.at(-1).nav/rows[0].nav,years=rets.length/252,mean=rets.reduce((a,b)=>a+b,0)/rets.length,variance=rets.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(1,rets.length-1);let peak=0,dd=0;for(const r of rows){peak=Math.max(peak,r.nav);dd=Math.min(dd,r.nav/peak-1)}return{total:growth-1,annual:Math.pow(growth,1/Math.max(years,1/252))-1,vol:Math.sqrt(variance)*Math.sqrt(252),dd,years}}
function run(){["aw","bw"].forEach(id=>$(id+"v").textContent=$(id).value+"%"),$("levv").textContent=(Number($("lev").value)/100).toFixed(2)+"x";const rows=build(),m=metrics(rows);if(!m){$("status").textContent="資料不足，請縮短視窗或換資產";return}$("title").textContent=$("a").selectedOptions[0].text+" + "+$("b").selectedOptions[0].text;$("ret").textContent=pct(m.total);$("ann").textContent=pct(m.annual);$("vol").textContent=pct(m.vol);$("dd").textContent=pct(m.dd);$("formula").textContent="權重 "+$("aw").value+"% + "+$("bw").value+"%，槓桿 "+$("lev").value/100+"x，視窗 "+$("window").value;$("table").innerHTML="<tr><td>期末淨值</td><td>"+(1+m.total).toFixed(4)+"x</td></tr><tr><td>觀測年數</td><td>"+m.years.toFixed(2)+" 年</td></tr>";draw(rows)}
function draw(rows){const c=$("chart"),box=c.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=box.width*ratio;c.height=box.height*ratio;const ctx=c.getContext("2d");ctx.scale(ratio,ratio);const w=box.width,h=box.height,p={l:42,r:10,t:14,b:20},min=Math.min(...rows.map(x=>x.nav)),max=Math.max(...rows.map(x=>x.nav)),xs=i=>p.l+i/(rows.length-1)*(w-p.l-p.r),ys=v=>h-p.b-(v-min)/(max-min||1)*(h-p.t-p.b);ctx.clearRect(0,0,w,h);ctx.strokeStyle="#dbe4ee";for(let j=0;j<5;j++){const y=p.t+j*(h-p.t-p.b)/4;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(w-p.r,y);ctx.stroke()}ctx.strokeStyle="#0284c7";ctx.lineWidth=2;ctx.beginPath();rows.forEach((r,i)=>i?ctx.lineTo(xs(i),ys(r.nav)):ctx.moveTo(xs(i),ys(r.nav)));ctx.stroke()}
$("run").addEventListener("click",run);["a","b","aw","bw","lev","filter","window"].forEach(id=>$(id).addEventListener("change",run));window.addEventListener("resize",run);load().catch(()=>$("status").textContent="資料載入失敗");
</script></html>
