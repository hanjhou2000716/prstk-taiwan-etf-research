<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回測期間｜PRStK</title><style>body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;max-width:1000px;margin:auto;padding:24px;background:#f3f7fb;color:#172033}main{background:#fff;border-radius:16px;padding:24px}h1{color:#075985}a{color:#0369a1}.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #dbe4ee;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.ok{color:#15803d}.no{color:#b91c1c}</style><main><p><a href="index.html">← 回到首頁</a></p><h1>20／10／5／3／1 年回測期間</h1><div class="note">Actual 只代表 ETF 實際上市後的資料。上市前不回填、不拼接、不把合成代理冒充真實 ETF。</div><table class="table"><thead><tr><th>標的</th><th>期間</th><th>狀態</th><th>起始日</th><th>總報酬</th><th>最大回撤</th></tr></thead><tbody id="rows"></tbody></table><p>若要做 20 年研究，下一階段會另建 Synthetic 2X Index Proxy，並和 Actual ETF 分欄呈現。</p></main><script>const names={buy_hold_00685L:"00685L 群益臺灣加權正2",buy_hold_00631L:"00631L 元大台灣50正2"};fetch("data/horizon_metrics.json").then(r=>r.json()).then(rows=>{document.querySelector("#rows").innerHTML=rows.filter(x=>names[x.strategy]).map(x=>`<tr><td>${names[x.strategy]}</td><td>${x.horizon_years} 年</td><td class="${x.status==='available'?'ok':'no'}">${x.status==='available'?'Actual 可用':'不可用：上市歷史不足'}</td><td>${x.start||'—'}</td><td>${x.total_return==null?'—':(x.total_return*100).toFixed(2)+'%'}</td><td>${x.max_drawdown==null?'—':(x.max_drawdown*100).toFixed(2)+'%'}</td></tr>`).join("")}).catch(()=>document.querySelector("#rows").innerHTML='<tr><td colspan="6">資料尚未發布，請稍後查看 GitHub Actions。</td></tr>')</script></html>
