<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRStK 長期視窗</title><link rel="stylesheet" href="styles.css"><header class="site-header"><div class="site-shell header-inner"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>PRStK / HORIZONS</span></a><nav class="nav"><a href="builder.html">策略建構</a><a href="dashboard.html">儀表板</a><a href="proposal.html">研究方法</a></nav></div></header><main class="site-shell"><section class="hero fade-in"><p class="eyebrow">Horizon Analysis</p><h1 class="display">長期視窗，不把不同資料混成一個答案。</h1><p class="lead">實際 ETF 的上市年限有限；合成正二代理則用來回答產品上市前的長期情境問題。</p></section><section class="section fade-in delay-1"><div class="section-title"><h2>20／10／5／3／1 年結果</h2><p id="updated">Loading</p></div><div class="table-wrap"><table class="data-table"><thead><tr><th>策略／產品</th><th>視窗</th><th>資料類型</th><th>起始日</th><th>累積報酬</th><th>最大回撤</th></tr></thead><tbody id="rows"><tr><td colspan="6">讀取資料中…</td></tr></tbody></table></div></section><section class="section"><div class="note"><strong>如何閱讀：</strong>Actual ETF 是上市後的真實產品資料；Synthetic 2X Proxy 是以 TWSE 0050 調整後價格計算的每日 2 倍模型，不包含真實產品的管理費、追蹤差、配息、稅費與流動性。</div></section><footer class="footer"><a href="index.html">← 回到研究平台</a></footer></main><script>
const names={buy_hold_00685L:"00685L actual ETF",buy_hold_00631L:"00631L actual ETF",synthetic_2x_proxy_00685L:"00685L 20y synthetic proxy",synthetic_2x_proxy_00631L:"00631L 20y synthetic proxy"};const pct=x=>x==null?"-":(x*100).toFixed(2)+"%";
fetch("data/horizon_metrics.json").then(r=>r.json()).then(rows=>{document.querySelector("#updated").textContent=rows.length+" horizon observations";document.querySelector("#rows").innerHTML=rows.filter(x=>names[x.strategy]).map(x=>{const ok=x.status==="available",kind=x.data_type==="synthetic_2x_proxy"?"Synthetic Proxy":ok?"Actual ETF":"Unavailable";return"<tr><td>"+names[x.strategy]+"</td><td>"+x.horizon_years+" years</td><td><span class=\"status "+(ok?"good":x.data_type==="synthetic_2x_proxy"?"warn":"")+"\">"+kind+"</span></td><td>"+(x.start||"-")+"</td><td>"+(ok?pct(x.total_return):"-")+"</td><td>"+(ok?pct(x.max_drawdown):"-")+"</td></tr>"}).join("")}).catch(()=>document.querySelector("#rows").innerHTML="<tr><td colspan=\"6\">Data is not available yet.</td></tr>");
</script></html>
