<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PRStK 長期視窗</title>
    <link rel="stylesheet" href="styles/design-system.css?v=20260808-ds2">
  </head>
  <body class="legacy-archive-page">
    <header class="site-header" data-site-header></header>
    <main class="site-shell">
      <div class="breadcrumb"><a href="index.html">研究總覽</a><span>/</span><span>長期視窗</span></div>
      <section class="hero fade-in">
        <p class="eyebrow">Horizon Analysis</p>
        <h1 class="display">長期視窗，不把不同資料混成一個答案。</h1>
        <p class="lead">實際 ETF 的上市年限有限；合成正二代理則用來回答產品上市前的長期情境問題。</p>
      </section>
      <section class="section fade-in delay-1">
        <div class="section-title"><h2>20／10／5／3／1 年結果</h2><p id="updated">讀取中…</p></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>策略／產品</th><th>視窗</th><th>資料類型</th><th>起始日</th><th>累積報酬</th><th>最大回撤</th></tr></thead>
            <tbody id="rows"><tr><td colspan="6">讀取資料中…</td></tr></tbody>
          </table>
        </div>
      </section>
      <section class="section">
        <div class="note"><strong>如何閱讀：</strong>Actual ETF 是上市後的真實產品資料；Synthetic 2X Proxy 是以 TWSE 0050 調整後價格計算的每日 2 倍模型，不包含真實產品的管理費、追蹤差、配息、稅費與流動性。</div>
      </section>
      <footer class="footer">@2026 PRStK Lab &amp; SFC.e. | All right reserved.</footer>
    </main>
    <script type="module">
      const names = {
        buy_hold_00685L: "00685L 實際 ETF",
        buy_hold_00631L: "00631L 實際 ETF",
        synthetic_2x_proxy_00685L: "00685L 20 年合成正二代理",
        synthetic_2x_proxy_00631L: "00631L 20 年合成正二代理",
      };
      const pct = (value) => value == null ? "-" : `${(value * 100).toFixed(2)}%`;
      const rows = document.querySelector("#rows");
      fetch("data/horizon_metrics.json")
        .then((response) => response.json())
        .then((observations) => {
          document.querySelector("#updated").textContent = `${observations.length} 筆視窗觀測`;
          rows.innerHTML = observations.filter((item) => names[item.strategy]).map((item) => {
            const available = item.status === "available";
            const synthetic = item.data_type === "synthetic_2x_proxy";
            const kind = synthetic ? "Synthetic Proxy" : available ? "Actual ETF" : "Unavailable";
            const statusClass = available ? "good" : synthetic ? "warn" : "";
            return `<tr><td>${names[item.strategy]}</td><td>${item.horizon_years} 年</td><td><span class="status ${statusClass}">${kind}</span></td><td>${item.start || "-"}</td><td>${available ? pct(item.total_return) : "-"}</td><td>${available ? pct(item.max_drawdown) : "-"}</td></tr>`;
          }).join("");
        })
        .catch(() => { rows.innerHTML = '<tr><td colspan="6">資料目前不可用。</td></tr>'; });
    </script>
    <script type="module" src="js/core/site-header.js?v=20260808-nav2"></script>
  <script type="module" src="js/core/legacy-archive.js?v=20260809-archive1"></script></body>
</html>
