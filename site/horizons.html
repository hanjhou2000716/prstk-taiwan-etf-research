<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRStK 長期視窗</title>
<style>body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;max-width:1100px;margin:auto;padding:24px;background:#f3f7fb;color:#172033}main{background:#fff;border-radius:16px;padding:24px}h1{color:#075985}a{color:#0369a1}.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px;line-height:1.6}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid #dbe4ee;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.ok{color:#15803d}.no{color:#b91c1c}.proxy{background:#e0f2fe}</style>
<main><p><a href="index.html">← 回到研究平台</a></p><h1>20／10／5／3／1 年長期視窗</h1><div class="note"><strong>兩種資料分開看：</strong>Actual ETF 是上市後真實產品資料；Synthetic 2X Proxy 是使用 TWSE 0050 調整後價格、每日報酬乘 2 的模型序列，用來延伸上市前視窗，不是可交易 ETF 的歷史績效。</div><table class="table" style="margin-top:18px"><thead><tr><th>策略／產品</th><th>視窗</th><th>資料類型</th><th>起始日</th><th>累積報酬</th><th>最大回撤</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>const names={buy_hold_00685L:"00685L 實際 ETF",buy_hold_00631L:"00631L 實際 ETF",synthetic_2x_proxy_00685L:"00685L 20年合成正二代理",synthetic_2x_proxy_00631L:"00631L 20年合成正二代理"};fetch("data/horizon_metrics.json").then(r=>r.json()).then(rows=>{document.querySelector("#rows").innerHTML=rows.filter(x=>names[x.strategy]).map(x=>{const ok=x.status==='available';return `<tr class="${x.data_type==='synthetic_2x_proxy'?'proxy':''}"><td>${names[x.strategy]}</td><td>${x.horizon_years} 年</td><td class="${ok?'ok':'no'}">${x.data_type==='synthetic_2x_proxy'?'Synthetic proxy':(ok?'Actual ETF':'資料不足')}</td><td>${x.start||'—'}</td><td>${ok?(x.total_return*100).toFixed(2)+'%':'—'}</td><td>${ok?(x.max_drawdown*100).toFixed(2)+'%':'—'}</td></tr>`}).join('')}).catch(()=>document.querySelector('#rows').innerHTML='<tr><td colspan="6">長期資料尚未發布，請稍後再試。</td></tr>')</script></html>
