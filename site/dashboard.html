<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>互動研究面板｜PRStK</title>
<style>
:root{--ink:#172033;--muted:#64748b;--line:#dbe4ee;--blue:#075985;--cyan:#0ea5e9;--bg:#f3f7fb;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header{background:#082f49;color:#fff;padding:28px max(20px,calc((100% - 1200px)/2));}header a{color:#bae6fd}main{max-width:1200px;margin:22px auto;padding:0 18px}.grid{display:grid;grid-template-columns:290px 1fr;gap:18px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px #1720330b}.panel h2,.section-title{margin:0 0 14px;color:var(--blue)}label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}select,input{width:100%;padding:10px;border:1px solid #b9c8d8;border-radius:9px;background:#fff;color:var(--ink);font:inherit}.checks label{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;margin:9px 0}.checks input{width:auto}.button{width:100%;margin-top:16px;border:0;border-radius:10px;padding:11px;background:var(--cyan);color:#fff;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric small{color:var(--muted);display:block}.metric strong{display:block;font-size:24px;margin-top:5px}.chart-card{margin-top:16px}.chart-wrap{height:370px;position:relative}.chart-wrap canvas{width:100%;height:100%}.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:13px;color:var(--muted)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:right}.table th:first-child,.table td:first-child{text-align:left}.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;margin-top:16px;color:#7c2d12;font-size:13px}.muted{color:var(--muted);font-size:13px}@media(max-width:850px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.chart-wrap{height:280px}}@media(max-width:480px){main{padding:0 10px}.cards{gap:8px}.metric strong{font-size:19px}}
</style>
<header><div style="max-width:1200px;margin:auto"><a href="index.html">← 研究首頁</a><h1 style="margin:12px 0 4px">互動研究面板</h1><div style="color:#bae6fd">選策略、調整區間與假設，查看實際回測序列</div></div></header>
<main><div class="grid"><aside class="panel"><h2>研究設定</h2><label for="range">回測區間</label><select id="range"><option value="all">完整資料</option><option value="5y">近 5 年</option><option value="3y">近 3 年</option><option value="1y">近 1 年</option></select><label for="capital">初始本金（TWD）</label><input id="capital" type="number" value="1000000" min="0" step="10000"><label>顯示策略</label><div id="checks" class="checks"></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>質押試算</h2><label for="collateral">擔保品市值（TWD）</label><input id="collateral" type="number" value="1000000" min="0" step="10000"><label for="rate">年利率（%）</label><input id="rate" type="number" value="3.3" min="0" step="0.1"><label for="ltv">最高借款成數（%）</label><input id="ltv" type="number" value="60" min="0" max="100"><label for="principal">目前借款本金（TWD）</label><input id="principal" type="number" value="600000" min="0" step="10000"><button class="button" id="apply">更新面板</button><p class="muted">資料由 TWSE 官方日成交資料回測；尚未等同含息總報酬。</p></aside>
<section><div class="cards"><div class="card metric"><small>目前策略</small><strong id="mStrategy">—</strong></div><div class="card metric"><small>區間總報酬</small><strong id="mReturn">—</strong></div><div class="card metric"><small>期末資產</small><strong id="mEnd">—</strong></div><div class="card metric"><small>最大回撤</small><strong id="mDrawdown">—</strong></div></div><div class="card chart-card"><h2 class="section-title">淨值曲線</h2><div class="chart-wrap"><canvas id="chart"></canvas></div><div id="legend" class="legend"></div></div><div class="card" style="margin-top:16px"><h2 class="section-title">策略比較</h2><div class="table-wrap"><table class="table"><thead><tr><th>策略</th><th>總報酬</th><th>年化</th><th>波動</th><th>Sharpe</th><th>最大回撤</th></tr></thead><tbody id="table"></tbody></table></div></div><div class="card" style="margin-top:16px"><h2 class="section-title">質押與借款試算</h2><div class="cards"><div class="metric"><small>最高可借</small><strong id="loan">—</strong></div><div class="metric"><small>半年利息</small><strong id="interest">—</strong></div><div class="metric"><small>目前維持率</small><strong id="maintenance">—</strong></div><div class="metric"><small>門檻狀態</small><strong id="state">—</strong></div></div><div class="note">維持率 = 擔保品市值 ÷ 借款本金。追繳 130%、借新還舊 166%、退擔保 167%。此區為模型試算，不代表券商實際核准條件。</div></div></section></div></main>
<script>
const files={"buy_hold_006208":"data/backtests/buy_hold_006208.csv","buy_hold_00685L":"data/backtests/buy_hold_00685L.csv","buy_hold_00631L":"data/backtests/buy_hold_00631L.csv","fixed_beta_50_cash_50_00685L":"data/backtests/fixed_beta_50_cash_50_00685L.csv","ma200_switch_00685L":"data/backtests/ma200_switch_00685L.csv","vix_switch_00685L":"data/backtests/vix_switch_00685L.csv","pledge_006208_once":"data/backtests/pledge_006208_once.csv","pledge_006208_dynamic":"data/backtests/pledge_006208_dynamic.csv","pledge_00685L_buy_006208":"data/backtests/pledge_00685L_buy_006208.csv","pledge_00685L_buy_00685L":"data/backtests/pledge_00685L_buy_00685L.csv"};
const labels={buy_hold_006208:"全倉 006208",buy_hold_00685L:"全倉 00685L",buy_hold_00631L:"全倉 00631L",fixed_beta_50_cash_50_00685L:"固定 Beta：50% 正二＋現金",ma200_switch_00685L:"00685L：200MA 切換",vix_switch_00685L:"VIX 波動切換",pledge_006208_once:"006208 一次質押",pledge_006208_dynamic:"006208 動態質押",pledge_00685L_buy_006208:"00685L 質押買 006208",pledge_00685L_buy_00685L:"00685L 質押買 00685L"};
const colors=["#0284c7","#7c3aed","#ea580c","#16a34a"];let all={};
async function load(){for(const [key,url] of Object.entries(files)){const response=await fetch(url);if(!response.ok)continue;const text=await response.text();const lines=text.trim().split(/\r?\n/);all[key]=lines.slice(1).map(line=>{const [date,strategy,nav]=line.split(",");return {date,nav:Number(nav)}})}const checks=document.querySelector("#checks");Object.keys(files).forEach((key,i)=>{if(!all[key])return;const l=document.createElement("label");l.innerHTML=`<input type="checkbox" data-key="${key}" ${i<2?"checked":""}> ${labels[key]}`;checks.appendChild(l)});document.querySelectorAll("input,select").forEach(x=>x.addEventListener("change",render));render()}
function money(n){return new Intl.NumberFormat("zh-TW",{style:"currency",currency:"TWD",maximumFractionDigits:0}).format(n)}function pct(n){return n==null?"—":(n*100).toFixed(2)+"%"}function selected(){return [...document.querySelectorAll("#checks input:checked")].map(x=>x.dataset.key)}function filtered(rows){const mode=document.querySelector("#range").value;let cutoff=null;if(mode!=="all"){const days={"1y":365,"3y":1095,"5y":1825}[mode];cutoff=new Date(new Date(rows.at(-1).date).getTime()-days*86400000)}return cutoff?rows.filter(x=>new Date(x.date)>=cutoff):rows}
function calc(rows){const first=rows[0].nav,last=rows.at(-1).nav;const r=last/first-1;const rets=rows.slice(1).map((x,i)=>x.nav/rows[i].nav-1);const years=Math.max(rets.length/252,1/252);const mean=rets.reduce((a,b)=>a+b,0)/Math.max(rets.length,1);const variance=rets.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(rets.length-1,1);const vol=Math.sqrt(variance)*Math.sqrt(252);const ann=last**(1/years)-1;const sharpe=vol?(mean*252)/vol:null;let peak=0,dd=0;rows.forEach(x=>{peak=Math.max(peak,x.nav);dd=Math.min(dd,x.nav/peak-1)});return {r,ann,vol,sharpe,dd,last}}
function render(){const keys=selected();const capital=Number(document.querySelector("#capital").value)||0;const datasets=keys.map(k=>({key:k,rows:filtered(all[k])}));if(!datasets.length)return;const first=calc(datasets[0].rows);document.querySelector("#mStrategy").textContent=labels[keys[0]];document.querySelector("#mReturn").textContent=pct(first.r);document.querySelector("#mEnd").textContent=money(capital*(1+first.r));document.querySelector("#mDrawdown").textContent=pct(first.dd);draw(datasets);let html="";datasets.forEach(d=>{const x=calc(d.rows);html+=`<tr><td>${labels[d.key]}</td><td>${pct(x.r)}</td><td>${pct(x.ann)}</td><td>${pct(x.vol)}</td><td>${x.sharpe==null?"—":x.sharpe.toFixed(2)}</td><td>${pct(x.dd)}</td></tr>`});document.querySelector("#table").innerHTML=html;pledge()}
function draw(datasets){const c=document.querySelector("#chart"),box=c.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=box.width*ratio;c.height=box.height*ratio;const ctx=c.getContext("2d");ctx.scale(ratio,ratio);const w=box.width,h=box.height,pad={l:48,r:18,t:18,b:28};ctx.clearRect(0,0,w,h);let min=Infinity,max=-Infinity;datasets.forEach(d=>d.rows.forEach(x=>{min=Math.min(min,x.nav);max=Math.max(max,x.nav)}));min=Math.min(min,1);const xscale=i=>pad.l+i/(Math.max(datasets[0].rows.length-1,1))*(w-pad.l-pad.r);const yscale=v=>h-pad.b-(v-min)/(max-min||1)*(h-pad.t-pad.b);ctx.strokeStyle="#dbe4ee";ctx.lineWidth=1;for(let j=0;j<5;j++){const y=pad.t+j*(h-pad.t-pad.b)/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillStyle="#64748b";ctx.font="11px system-ui";ctx.fillText((max-(max-min)*j/4).toFixed(2)+"x",4,y+4)}datasets.forEach((d,di)=>{ctx.strokeStyle=colors[di%colors.length];ctx.lineWidth=2;ctx.beginPath();d.rows.forEach((v,i)=>{const x=pad.l+i/(Math.max(d.rows.length-1,1))*(w-pad.l-pad.r);const y=yscale(v.nav);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});document.querySelector("#legend").innerHTML=datasets.map((d,i)=>`<span><i class="dot" style="background:${colors[i%colors.length]}"></i>${labels[d.key]}</span>`).join("")}
function pledge(){const c=Number(document.querySelector("#collateral").value)||0,r=Number(document.querySelector("#rate").value)||0,l=Number(document.querySelector("#ltv").value)||0,p=Number(document.querySelector("#principal").value)||0;const ratio=p?c/p:Infinity;document.querySelector("#loan").textContent=money(c*l/100);document.querySelector("#interest").textContent=money(p*r/100*0.5);document.querySelector("#maintenance").textContent=ratio===Infinity?"∞":(ratio*100).toFixed(1)+"%";document.querySelector("#state").textContent=ratio<1.3?"追繳":ratio<1.66?"不可借新還舊":ratio<1.67?"可借新還舊":"可退擔保"}window.addEventListener("resize",render);document.querySelector("#apply").addEventListener("click",render);load().catch(e=>{document.querySelector("#mStrategy").textContent="資料載入失敗";console.error(e)});
</script></html>
