  <noscript><div style="padding:32px;font-family:sans-serif">此互動研究工具需要啟用 JavaScript 才能使用。</div></noscript>

  <script src="./survival-engine.js?v=0.6.0"></script>
  <script>/**
 * LPOS Portfolio Lab Web V0.1 - deterministic, browser-safe capital model.
 * NO price feed, NO claim of pledge eligibility, NO historical backtest.
 * Units: TWD, ratios entered as percent 0..100, APR as percent per annum.
 * No external source is requested by this module.
 */
const MODEL_VERSION = 'web-v0.6.0';
const MAX_ASSETS = 12;
const WARN_THRESHOLD = 130;
const RESTORE_TARGET = 166;
const COST_PCT_DEFAULT = 0.2425; // V2.6: 0.1425% + illustrative 0.10%

const CATALOG = [
  {symbol:'0050', name:'元大台灣50', factor:1},
  {symbol:'006208', name:'富邦台50', factor:1},
  {symbol:'00631L', name:'元大台灣50正2', factor:2},
  {symbol:'00685L', name:'群益臺灣加權正2', factor:2},
  {symbol:'0056', name:'元大高股息', factor:1},
  {symbol:'00878', name:'國泰永續高股息', factor:1},
  {symbol:'00919', name:'群益台灣精選高息', factor:1},
  {symbol:'VT', name:'Vanguard Total World Stock ETF', factor:1},
];
const catalogFund = (symbol) => CATALOG.find(x => x.symbol === symbol) ?? null;
function makeFund(symbol, initialOwn=0, initialLoan=0){
  const found = catalogFund(symbol);
  return { id: symbol+'-'+Math.random().toString(36).slice(2,8), symbol,
    name:found?.name??symbol, factor:found?.factor??1,
    ownWeightPct:initialOwn, loanWeightPct:initialLoan,
    pledgePct:0, ltvPct:60, pledgeStatus:'assumed' };
}
function defaultScenario(){
  const a=makeFund('006208',50,50);a.pledgePct=100;
  const b=makeFund('00878',50,50);b.pledgePct=100;
  return {
    schemaVersion:1, scenarioName:'基準情境', ownCapital:1000000,
    ownCashPct:20, tradeCostPct:COST_PCT_DEFAULT,
    borrowUtilPct:100, loanInvestPct:100, originationFeePct:0,
    aprPct:4, termMonths:6, monthlyFreeCashFlow:20000,
    monthlyLivingExpense:20000, minReserveMonths:3,
    shockPct:30, funds:[a,b],
  };
}
function validateScenario(p){
  const errors=[];
  const warnings=[];
  if(!p || typeof p!=='object') return {errors:['設定物件格式不正確'],warnings};
  const check = (key, low, high, label, inclusiveZero=true) => {
    const n=p[key];
    if(typeof n!=='number'||!Number.isFinite(n)||n<low||n>high||(!inclusiveZero && n===0)) errors.push(`${label}必須介於 ${low} 至 ${high}`);
  };
  check('ownCapital',1,1e12,'自有資金');
  check('ownCashPct',0,100,'自有現金比例');
  check('tradeCostPct',0,20,'每筆買進成本率');
  check('borrowUtilPct',0,100,'借款動用比例');
  check('loanInvestPct',0,100,'借款再投資比例');
  check('originationFeePct',0,20,'借款開辦費比例');
  check('aprPct',0,50,'借款年利率');
  check('termMonths',1,360,'借款期數');
  check('monthlyFreeCashFlow',-1e9,1e9,'每月自由現金流');
  check('monthlyLivingExpense',0,1e9,'每月必要支出');
  check('minReserveMonths',0,36,'緊急預備月數');
  check('shockPct',0,100,'單次壓力下跌比例');
  if(!Number.isInteger(p.termMonths)) errors.push('借款月數必須是整數');
  if(!Number.isInteger(p.minReserveMonths)) errors.push('緊急預備月數必須是整數');
  if(!Array.isArray(p.funds) || p.funds.length===0 || p.funds.length>MAX_ASSETS){
    errors.push(`標的數量必須為 1 至 ${MAX_ASSETS} 個`);
    return {errors,warnings};
  }
  const seen=new Set(),seenSymbols=new Set();
  p.funds.forEach((f,i)=>{
    if(!f || typeof f!=='object') { errors.push(`第 ${i+1} 筆標的有誤`); return; }
    const tag = `標的 ${i+1}`;
    if(typeof f.symbol!=='string'||!/^[A-Z0-9._-]{1,16}$/.test(f.symbol)) errors.push(`${tag}代號無效`);
    if(typeof f.name!=='string'||f.name.length>80) errors.push(`${tag}名稱無效`);
    if(typeof f.id!=='string'||f.id.length>100||seen.has(f.id)) errors.push(`${tag}識別碼不正確或重複`);
    seen.add(f.id);
    if(seenSymbols.has(f.symbol))errors.push(`${tag}代號重複，請合併同一 ETF`);
    seenSymbols.add(f.symbol);
    if(f.factor!==1&&f.factor!==2) errors.push(`${tag}倍數只支援 1 或 2`);
    for(const key of ['ownWeightPct','loanWeightPct','pledgePct','ltvPct']){
      if(typeof f[key]!=='number'||!Number.isFinite(f[key])||f[key]<0||f[key]>100)errors.push(`${tag}的 ${key} 不在 0 至 100`);
    }
    if(f.pledgeStatus!=='assumed'&&f.pledgeStatus!=='blocked')errors.push(`${tag}的質押資格狀態無效`);
    if(f.pledgeStatus==='blocked'&&f.pledgePct>0)warnings.push(`${f.symbol}標示不可質押，其質押比例不計入擔保額度`);
    if(f.factor===2&&f.pledgePct>0)warnings.push(`${f.symbol} 是每日重設正二 ETF；質押資格與折算率未驗證，且單次下跌推算不等於多日真實報酬`);
    if(f.pledgePct>0&&f.pledgeStatus==='assumed')warnings.push(`${f.symbol} 的質押資格與可貸成數僅為情境假設，未取得券商核准`);
  });
  if(errors.length) return {errors,warnings};
  const totalOwn=p.funds.reduce((s,f)=>s+f.ownWeightPct,0);
  const totalBorrowed=p.funds.reduce((s,f)=>s+f.loanWeightPct,0);
  if(Math.abs(totalOwn-100)>1e-6)errors.push(`自有資金配置總和為 ${totalOwn.toFixed(1)}%，必須為 100%`);
  // Loan weights also need to sum to 100, because user may later increase credit draw.
  if(Math.abs(totalBorrowed-100)>1e-6)errors.push(`借款再投入配置總和為 ${totalBorrowed.toFixed(1)}%，必須為 100%`);
  if(p.aprPct===0&&p.borrowUtilPct>0)warnings.push('0% 融資利率是純假設；不是券商已承諾的報價');
  return {errors,warnings};
}

/** Normalize weights to one decimal percentage-point, without remainder drift. */
function normalizeFunds(funds, field){
  if(!['ownWeightPct','loanWeightPct'].includes(field)) throw new Error('invalid allocation field');
  if(!Array.isArray(funds)||!funds.length)throw new Error('fund list must not be empty');
  const weights=funds.map(f=>Number.isFinite(f[field])?Math.max(0,f[field]):0);
  const total=weights.reduce((a,b)=>a+b,0);
  const units=total===0 ? weights.map(()=>1000/funds.length) : weights.map(v=>v/total*1000);
  const floors=units.map(Math.floor);
  const toAdd=1000-floors.reduce((a,b)=>a+b,0);
  const order=units.map((v,i)=>({i,frac:v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac||a.i-b.i);
  for(let j=0;j<toAdd;j++)floors[order[j].i]++;
  return funds.map((f,i)=>({...f,[field]:floors[i]/10}));
}
function stressMultiplier(factor, marketFallPct){
  return Math.max(0, 1-factor*marketFallPct/100);
}
function finiteNonNegative(n){ return Number.isFinite(n)?Math.max(0,n):0; }

/** Pure one-snapshot capital allocation + one-step market stress. */
function calculateScenario(p, shockOverride=null){
  const chk=validateScenario(p);
  if(chk.errors.length)return {valid:false, errors:chk.errors, warnings:chk.warnings};
  const shock = shockOverride===null ? p.shockPct : shockOverride;
  if(!Number.isFinite(shock)||shock<0||shock>100)return {valid:false,errors:['壓力下跌比例需介於 0～100%'],warnings:chk.warnings};
  const ownInvestBudget=p.ownCapital*(1-p.ownCashPct/100);
  const ownCash=p.ownCapital-ownInvestBudget;
  const costFactor=1+p.tradeCostPct/100;
  const ownMarket=ownInvestBudget/costFactor;
  const ownTradeFees=ownInvestBudget-ownMarket;
  const legs=p.funds.map(f=>{
    const ownValue=ownMarket*f.ownWeightPct/100;
    const pledgedValue=f.pledgeStatus==='blocked'?0:ownValue*f.pledgePct/100;
    const capacity=pledgedValue*f.ltvPct/100;
    return { id:f.id,symbol:f.symbol, name:f.name,factor:f.factor,
      ownValue,pledgedValue,capacity, ownWeightPct:f.ownWeightPct,
      loanWeightPct:f.loanWeightPct,pledgePct:f.pledgePct,ltvPct:f.ltvPct,
      pledgeStatus:f.pledgeStatus};
  });
  const collateral=legs.reduce((s,f)=>s+f.pledgedValue,0);
  const loanCapacity=legs.reduce((s,f)=>s+f.capacity,0);
  const borrow=loanCapacity*p.borrowUtilPct/100;
  const loanFee=borrow*p.originationFeePct/100;
  const usableLoan=borrow-loanFee;
  const loanBudget=usableLoan*p.loanInvestPct/100;
  const borrowedCash=usableLoan-loanBudget;
  const loanMarket=loanBudget/costFactor;
  const loanTradeFees=loanBudget-loanMarket;
  const liquidCash=ownCash+borrowedCash;
  const assets=ownMarket+loanMarket+liquidCash;
  const netAsset=assets-borrow;
  const exposureEq=legs.reduce((s,f)=>{
    f.loanValue=loanMarket*f.loanWeightPct/100;
    f.totalValue=f.ownValue+f.loanValue;
    f.eqExposure=f.totalValue*f.factor;
    return s+f.eqExposure;
  },0);
  const holdingValue=ownMarket+loanMarket;
  const grossMarketExposurePct=netAsset>0?holdingValue/netAsset*100:null;
  const equityExposurePct=netAsset>0?exposureEq/netAsset*100:null;
  const maintenancePct=borrow>1e-8?collateral/borrow*100:null;
  const monthlyInterest=borrow*p.aprPct/1200;
  const projectedMonthlyFlow=p.monthlyFreeCashFlow-monthlyInterest;
  // Maturity: no market profits, no sale proceeds, no rollover and no refinancing.
  const maturityCash=liquidCash+projectedMonthlyFlow*p.termMonths;
  const maturityGap=Math.max(0,borrow-Math.max(0,maturityCash));
  const reserveTarget=p.monthlyLivingExpense*p.minReserveMonths;
  const earliestCashDeficitMonth=projectedMonthlyFlow<0 && liquidCash>=0 ? Math.floor(liquidCash/(-projectedMonthlyFlow))+1:null;
  const stressedLegs=legs.map(f=>{
    const mult=stressMultiplier(f.factor,shock);
    return {...f, stressFactor:mult, stressedOwnValue:f.ownValue*mult,
      stressedLoanValue:f.loanValue*mult,stressedCollateral:f.pledgedValue*mult};
  });
  const stressedHoldings=stressedLegs.reduce((s,f)=>s+f.stressedOwnValue+f.stressedLoanValue,0);
  const stressedCollateral=stressedLegs.reduce((s,f)=>s+f.stressedCollateral,0);
  const stressedAssets=stressedHoldings+liquidCash;
  const stressedNetAsset=stressedAssets-borrow;
  const stressedMaintenancePct=borrow>1e-8?stressedCollateral/borrow*100:null;
  const marginTrigger=borrow>0 && stressedMaintenancePct<WARN_THRESHOLD;
  const topUpCollateralValue=marginTrigger?Math.max(0,borrow*RESTORE_TARGET/100-stressedCollateral):0;
  const stressedEqExposure=stressedLegs.reduce((s,f)=>s+(f.stressedOwnValue+f.stressedLoanValue)*f.factor,0);
  const shockedExposurePct=stressedNetAsset>0?stressedEqExposure/stressedNetAsset*100:null;
  const fees=ownTradeFees+loanFee+loanTradeFees;
  const accountingDifference=netAsset-(p.ownCapital-fees);
  const warnings=[...chk.warnings];
  if(equityExposurePct!==null&&equityExposurePct>130) warnings.push(`初始股票等值曝險 ${equityExposurePct.toFixed(1)}% 高於參考的 130% 自有淨資產風險預算；此值不是券商維持率`);
  if(maintenancePct!==null&&maintenancePct<RESTORE_TARGET)warnings.push('初始擔保維持率低於參考的 166% 補繳目標，需審慎確認券商條款');
  if(marginTrigger)warnings.push(`下跌 ${shock}% 的簡化情境中維持率低於 130%，參考補到 166% 的擔保市值缺口約為 NT$ ${Math.ceil(topUpCollateralValue).toLocaleString('en-US')}`);
  if(maturityGap>0.005)warnings.push(`第 ${p.termMonths} 個月到期，單靠現金與假設每月自由現金流仍有 NT$ ${Math.ceil(maturityGap).toLocaleString('en-US')} 的本金缺口；沒有假設可續借或當天出售立即入帳`);
  if(liquidCash<reserveTarget)warnings.push(`流動現金不足 ${p.minReserveMonths} 個月必要開銷的預備金門檻`);
  if(earliestCashDeficitMonth!==null&&earliestCashDeficitMonth<=p.termMonths) warnings.push(`若市場不變、自由現金流持續負值，預估第 ${earliestCashDeficitMonth} 個月可能出現現金不足`);
  warnings.push('自由配置 V0.2 資金模型不計配息、報酬、匯率變動、借款展延、T+2 交割與實際清償順序；正二 ETF 壓力只做單步近似');
  return { valid:true, errors:[],warnings, config:p,shock,
    ownInvestBudget,ownCash,ownMarket,ownTradeFees,collateral,loanCapacity,
    borrow,loanFee,borrowedCash,loanBudget,loanMarket,loanTradeFees,liquidCash,
    assets,netAsset,exposureEq,holdingValue,equityExposurePct,grossMarketExposurePct,
    maintenancePct, monthlyInterest, projectedMonthlyFlow, maturityCash,maturityGap,
    earliestCashDeficitMonth, reserveTarget,fees,accountingDifference,
    stressedLegs,legs,stressedHoldings,stressedCollateral,stressedAssets,
    stressedNetAsset,stressedMaintenancePct,marginTrigger,topUpCollateralValue,
    stressedEqExposure,shockedExposurePct};
}

function validateAndParse(raw){
  if(typeof raw!=='string'||raw.length>100000)throw new Error('JSON 檔案太大或格式不正確');
  const p=JSON.parse(raw);
  if(!p||p.schemaVersion!==1)throw new Error('不支援的設定版本');
  // Ensure known canonical primitives are present, exclude unknown imported fields.
  const wanted=['schemaVersion','scenarioName','ownCapital','ownCashPct','tradeCostPct',
    'borrowUtilPct','loanInvestPct','originationFeePct','aprPct','termMonths',
    'monthlyFreeCashFlow','monthlyLivingExpense','minReserveMonths','shockPct'];
  const x=Object.fromEntries(wanted.map(k=>[k,p[k]]));
  x.scenarioName=typeof p.scenarioName==='string'?p.scenarioName.slice(0,60):'匯入方案';
  if(!Array.isArray(p.funds))throw new Error('標的陣列不存在');
  x.funds=p.funds.map((f,i)=>({
    id:typeof f?.id==='string'?f.id:`import-${i}`,symbol:f?.symbol,
    name:f?.name,factor:f?.factor,ownWeightPct:f?.ownWeightPct,
    loanWeightPct:f?.loanWeightPct,pledgePct:f?.pledgePct,
    ltvPct:f?.ltvPct,pledgeStatus:f?.pledgeStatus,
  }));
  const {errors}=validateScenario(x);
  if(errors.length)throw new Error(errors.join('；'));
  return x;
}

  if(values.length<2)return 0;
  const avg=values.reduce((a,b)=>a+b,0)/values.length;
  return Math.sqrt(values.reduce((a,b)=>a+(b-avg)**2,0)/(values.length-1));
}
function sharpeRatio(returns,rfPct){
  const sd=weightedStdev(returns);if(sd<1e-14)return null;
  const mean=returns.reduce((a,b)=>a+b,0)/returns.length;
  return Math.sqrt(TRADE_DAYS)*(mean-rfPct/100/TRADE_DAYS)/sd;

function drawdownStats(indexPath){

  for(const x of indexPath){peak=Math.max(peak,x);const dd=peak===0?0:x/peak-1;maxDD=Math.min(maxDD,dd);
    if(dd< -1e-10){currentUnderwater++;longest=Math.max(longest,currentUnderwater);}else currentUnderwater=0;
  }

  if(freq==='none'||!nextDate||date.slice(0,7)===nextDate.slice(0,7))return false;
  const d=new Date(dayStamp(date)),s=new Date(dayStamp(startDate));
  const months=(d.getUTCFullYear()-s.getUTCFullYear())*12+d.getUTCMonth()-s.getUTCMonth()+1;

  if(!period)throw Error('不支援的再平衡設定');

  let renewalAssumedCount=0,firstMarginDate=null,minMarginPct=null,marginSignalCount=0;
  let pledgedSaleRequiresRelease=false,unsettledProceedsUsed=false;
  let nextLoanMaturity=addMonths(startDate,scenario.termMonths);
  let index=r.netAsset/scenario.ownCapital;
  const initialNet=r.netAsset;

  const marketValue=values=>Object.values(values).reduce((s,v)=>s+v.own+v.loan,0);
  const postInterest=()=>{};
  function liquidateForCash(needed,date,reason){
    if(needed<=cash+1e-7)return true;
    const deficit=needed-cash;
    const grossNeed=deficit/(1-costRate);
    const values=getValues(date);
    // Sell non-pledged/loan units before own pledged units; settlement is instant proxy (not T+2).
    let remaining=grossNeed,sold=0,pledgedUsed=0;

      }

      rebalancePool(date,'own','ownWeightPct');

      events.push({date,type:'scheduled_rebalance',frequency:rebalance});
    }
    const vals=getValues(date);

    const maintenancePct=debt>1e-9?collateral/debt*100:null;

function compareDynamicBacktests(items,series,options={}){
  if(!Array.isArray(items)||!items.length||items.length>4)throw Error('請提供 1 至 4 個組合');
  const firstCapital=items[0].scenario.ownCapital;
  if(items.some(x=>Math.abs(x.scenario.ownCapital-firstCapital)>0.01))throw Error('A/B/C 同期比較須採相同自有資金');
  const dates=sharedDates(items.map(x=>x.scenario),series,options);
  const firstFlow=items[0].scenario.monthlyFreeCashFlow;
  if(items.some(x=>x.scenario.monthlyFreeCashFlow!==firstFlow))throw Error('公平比較須採相同每月外部自由現金流；請修正各方案，模型不會偷偷改寫');
  const results=items.map(({name,scenario})=>({name,...runDynamicBacktest(scenario,series,{...options,dates})}));
  for(const r of results)r.fullPeriod=!r.flags.hardFailure&&r.period.sessions===dates.length;
  const rankingEligible=results.every(r=>r.fullPeriod);
  // Failed paths remain visible; no annualized ranking across unequal realized horizons.
  for(const r of results)r.comparableCagrPct=rankingEligible?r.stats.cagrPct:null;
  return {ok:true,version:DYNAMIC_VERSION,priceGrade:PRICE_GRADE,rankingEligible,ownCapital:firstCapital,monthlyFreeCashFlow:firstFlow,period:{start:dates[0],end:dates.at(-1),sessions:dates.length},results};
}
function backtestCsv(result){
  if(!result?.ok||!result.path)throw Error('沒有可匯出的歷史路徑');
  const header=['date','net_asset_twd','cash_twd','debt_twd','accrued_interest_twd','holdings_twd','maintenance_pct','equity_exposure_pct','twr_index'];

function chartStress(r){
  const maxFall=Math.max(80,Math.ceil(r.shock/10)*10);
  const xs=Array.from({length:maxFall/10+1},(_,i)=>i*10).map(fall=>({fall,result:calculateScenario(current,fall)}));
  const values=xs.map(x=>x.result.stressedNetAsset/current.ownCapital*100);
  const lo=Math.min(0,...values)-10,hi=Math.max(105,...values)+4;
  const X=(v)=>50+v/maxFall*540;
  const Y=(v)=>18+(hi-v)/(hi-lo)*216;
  const path=values.map((v,i)=>(i?'L':'M')+X(xs[i].fall).toFixed(2)+' '+Y(v).toFixed(2)).join(' ');
  const grid=[0,25,50,75,100].filter(y=>y>=lo&&y<=hi).map(y=>`<g><line x1="50" x2="590" y1="${Y(y)}" y2="${Y(y)}" stroke="#e8eef4"/><text x="40" y="${Y(y)+4}" font-size="11" text-anchor="end" fill="#9aabbc">${y}%</text></g>`).join('');
  const tick=xs.filter((_,i)=>i%2===0).map(x=>`<text x="${X(x.fall)}" y="255" text-anchor="middle" font-size="11" fill="#9aabbc">-${x.fall}%</text>`).join('');
  const selectedX=X(r.shock),selectedY=Y(r.stressedNetAsset/current.ownCapital*100);
  return `<div class="chartbox"><svg viewBox="0 0 624 280" role="img" aria-label="單步市場跌幅與淨資產比例關係圖">
    ${grid}${tick}<path d="${path}" fill="none" stroke="#376ce4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="${selectedX}" x2="${selectedX}" y1="17" y2="236" stroke="#e3a268" stroke-dasharray="4 4"/><circle cx="${selectedX}" cy="${selectedY}" r="5" stroke="#fff" stroke-width="3" fill="#e4a361"/>
    <text x="312" y="277" text-anchor="middle" font-size="11" fill="#8c9aaa">假設市場在單一時點下跌幅度</text></svg></div>`;
}

function v03Chart(items){
  if(!items.length)return '';
  const all=items.flatMap(x=>x.result.path.map(y=>y.twrIndex*100)).filter(Number.isFinite);
  if(!all.length)return '';
  const lo=Math.max(0,Math.min(...all)*.89),hi=Math.max(...all)*1.10;
  const firstDate=items.map(x=>x.result.path[0].date).sort()[0];
  const finalDate=items.map(x=>x.result.path.at(-1).date).sort().at(-1);
  const begin=Date.parse(firstDate+'T00:00:00Z'),finish=Date.parse(finalDate+'T00:00:00Z');
  const X=date=>55+(Date.parse(date+'T00:00:00Z')-begin)/(finish-begin||1)*674;
  const Y=x=>240-(x-lo)/(hi-lo||1)*211;
  const colors=['#366be6','#0b9f82','#9e78cc','#d79657'];
  const grid=[0,.25,.5,.75,1].map(q=>{const val=lo+(hi-lo)*q,y=Y(val);return `<line x1="55" y1="${y.toFixed(1)}" x2="730" y2="${y.toFixed(1)}" stroke="#e7edf4"/><text x="47" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#7d8ea2">${val.toFixed(0)}</text>`;}).join('');
  const lines=items.map((x,k)=>{
    const a=x.result.path,step=Math.max(1,Math.floor(a.length/260));
    const idx=[...new Set([0,...a.map((_,i)=>i).filter(i=>i%step===0),a.length-1])];
    const d=idx.map((i,j)=>(j?'L':'M')+X(a[i].date).toFixed(1)+','+Y(a[i].twrIndex*100).toFixed(1)).join(' ');
    return `<path d="${d}" stroke="${colors[k%colors.length]}" stroke-width="${k?2.3:3}" fill="none" stroke-linejoin="round"/>`;
  }).join('');
  const first=firstDate,last=finalDate;
  const legends=items.map((x,k)=>`<span class="v03-legend"><i style="background:${colors[k%colors.length]}"></i>${e(x.name)}</span>`).join('');
  return `<div class="v03-graph"><svg viewBox="0 0 760 280" role="img" aria-label="各策略的含融資成本、扣除外部金流影響之時間加權績效指數">${grid}${lines}<text x="55" y="266" font-size="10" fill="#7d8ea2">${e(first)}</text><text x="730" y="266" text-anchor="end" font-size="10" fill="#7d8ea2">${e(last)}</text></svg></div><div class="v03-legend-wrap">${legends}</div>`;
}

async function runSurvival(kind='solo'){
 const stamp=survivalStamp(),requestScenario=deepCopy(current),requestSettings={...survivalSettings},requestDates={from:v03Settings.from,to:v03Settings.to};
 survivalState={status:'loading',kind,result:null,cases:null,error:'',stamp};

  if(!window.LPOSSurvival)throw Error('生存引擎尚未載入，請重新整理網頁');
  const config=calculateScenario(requestScenario);
  if(!config.valid)throw Error('配置或質押參數有誤：'+config.errors.join('；'));
  const available=supportedSymbols(requestScenario);
  if(available.unsupported.length)throw Error('不支援的逐日 ETF：'+[...new Set(available.unsupported)].join('、'));
  const series=await loadMarketSeries(available.symbols);
  const dates=sharedDates([requestScenario],series,requestDates);
  const result=window.LPOSSurvival.run(requestScenario,config,series,dates,requestSettings);
  const cases=kind==='cases'?window.LPOSSurvival.scenarios(requestSettings).map(([name,settings])=>
    ({name,result:window.LPOSSurvival.run(requestScenario,config,series,dates,settings)})):null;
  survivalState={status:'ready',kind,result,cases,error:'',stamp};
 }catch(err){survivalState={status:'error',kind,result:null,cases:null,error:String(err.message||err),stamp}}
 render();
}

 const close=(a,b)=>Math.abs(a-b)<=Math.max(.01,Math.abs(a)*1e-12);
 const checks=[
  ['資產＝持股＋流動現金',close(r.assets,r.holdingValue+r.liquidCash)],
  ['淨資產＝自有資金－全部初始費用',close(r.netAsset,r.config.ownCapital-r.fees)],
  ['借款＝額度×動用比例',close(r.borrow,r.loanCapacity*r.config.borrowUtilPct/100)],
  ['擔保額度＝各檔擔保市值×LTV',close(r.loanCapacity,r.legs.reduce((a,l)=>a+l.pledgedValue*l.ltvPct/100,0))],
  ['借款部位不重複質押',r.legs.every(l=>close(l.pledgedValue,l.pledgeStatus==='blocked'?0:l.ownValue*l.pledgePct/100))]
 ];
 return {ok:checks.every(x=>x[1]),checks};
}
async function runDecision(){
 // These independent research runs share the same scenario and chosen date window.
 await Promise.all([runV03('solo'),runSurvival('cases')]);
}
function decisionOverview(r){
 const audit=auditCapital(r);
 const bt=v03State.kind==='solo'&&v03State.stamp===backtestStamp()?v03State.result:null;
 const sv=survivalState.stamp===survivalStamp()?survivalState.result:null;
 const cases=sv?survivalState.cases:null;
 const stale=(v03State.result&&!bt)||(survivalState.result&&!sv);
 const busy=v03State.status==='loading'||survivalState.status==='loading';
 const error=[v03State.status==='error'&&v03State.stamp===backtestStamp()?v03State.error:'',survivalState.status==='error'&&survivalState.stamp===survivalStamp()?survivalState.error:''].filter(Boolean);
 const rows=[
  ['報酬｜代理時間加權 CAGR',bt&&!bt.flags.hardFailure?pct(bt.stats.cagrPct,2):'尚未完成有效研究'],
  ['風險｜代理最大回撤',bt?pct(bt.stats.mddPct,2):'—'],
  ['報酬研究實際期間',bt?e(bt.period.start+' ～ '+bt.period.end):'—'],
  ['報酬模型執行限制',bt?(bt.flags.unsettledProceedsUsed?'曾使用即時賣出款代理；須另看 T+2 生存':'交易／融資執行均未核實'):'—'],
  ['生存｜觀測結果',sv?(sv.firstHard?'中斷：'+e(survivalRiskLabel(sv.firstHard.type)):(sv.horizonCovered?'完成指定觀測期':'資料不足指定觀測期')):'尚未計算'],
  ['生存研究實際期間',sv?e(sv.period.from+' ～ '+sv.period.realizedTo):'—'],
  ['首次維持率警訊',sv?e(sv.firstMargin||'觀測期內無'):'—'],
  ['首次預備金不足',sv?e(sv.firstReserve||'觀測期內無'):'—'],
  ['期末未償本金',sv?m(sv.unpaidLoan):'—'],
  ['五情境完成數（非機率）',cases?cases.filter(x=>x.result.completed&&x.result.horizonCovered).length+' / '+cases.length:'—'],
  ['續借條件',sv?(sv.conditionalOnLoanRollover?'依賴假設續借，未獲核准':'未假設續借'):'—'],
 ];
 return panel('V0.6 決策總覽｜報酬・風險・存活','研究行情是調整價格代理，非已驗證含息真實可執行融資回測。報酬與生存引擎方法不同，各自列示實際期間；五情境完成數不是存活機率。',
  `<div class="row-actions">${button(busy?'計算中…':'計算目前報酬／生存','decision-run','primary',busy?'disabled':'')}${supportedSymbols(current).unsupported.length?button('套用有行情的 ETF 示範組合','survival-sample'):''}</div>
  <p class="footnote">報酬日期 ${e(v03Settings.from||'共同起日')} ～ ${e(v03Settings.to||'共同末日')}；生存觀測 ${survivalSettings.horizonMonths} 月、額外衝擊 ${survivalSettings.shockPct}%、${e(survivalSettings.rollover)}。調整期間請至歷史研究；壓力參數請至生存分析。</p>
  ${stale?'<div class="warning-block">設定已變更，舊結果已隱藏。請重新計算。</div>':''}
  ${error.map(x=>'<div class="error-list">'+e(x)+'</div>').join('')}
  <div class="stats">${rows.map(([a,b])=>stat(a,b)).join('')}</div>
  <details><summary>財務模型審計：${r.valid?(audit.ok?'全部通過':'發現不一致'):'請修正配置'}</summary><div class="stats">${audit.checks.map(([a,b])=>stat(a,b?'通過':'失敗',b?'green':'bad')).join('')}</div><p class="footnote">這些是會計一致性檢核，不代表資料來源、ETF 質押資格或券商實際執行已驗證。</p></details>`);
}

function body(tab,r){switch(tab){case'portfolio':return portfolio(r);case'financing':return financing(r);case'stress':case'survival':return integratedSurvival(r);case'compare':return compare(r);case'sources':return sources(r);case'research':case'backtest':return unifiedBacktest();default:return decisionOverview(r)+overview(r);}}

  const [title,subtitle]=titles[tab];
  app.innerHTML=`${mobileMenu(tab)}<div class="app-shell">
    <aside class="sidebar"><div class="brand"><span class="brand-symbol">LP</span><div><div class="brand-name">LPOS Lab</div><div class="brand-sub">PORTFOLIO RESEARCH</div></div></div>

    </aside>

      <div class="actions">${button('↺ 回復預設','reset')}${button('匯入 JSON','import')}${button('匯出設定','export','slim')}${button('匯出整合研究','export-workspace','primary')}</div></header>

    </main>
  </div>`;
  safeSave();
}
function download(filename,content,mime='application/json'){
  const blob=new Blob([content],{type:mime+';charset=utf-8'});
  const url=URL.createObjectURL(blob);const link=document.createElement('a');
  link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function changeField(field,value){
  const keys={ownCapital:[1,1e12],ownCashPct:[0,100],tradeCostPct:[0,20],borrowUtilPct:[0,100],loanInvestPct:[0,100],originationFeePct:[0,20],aprPct:[0,50],termMonths:[1,360],monthlyFreeCashFlow:[-1e9,1e9],monthlyLivingExpense:[0,1e9],minReserveMonths:[0,36],shockPct:[0,100]};
  if(!Object.hasOwn(keys,field))return;
  const parsed=String(value).trim()===''?NaN:Number(value);
  // Invalid input temporarily generates a visible validation error.
  current[field]=parsed;
  render();
}
function changeFund(id,field,value){
  const fund=current.funds.find(f=>f.id===id);if(!fund)return;
  if(field==='pledgeStatus'){if(value!=='assumed'&&value!=='blocked')return;fund[field]=value;}
  else if(field==='factor'){const x=Number(value);if(![1,2].includes(x))return;fund.factor=x;}
  else if(['ownWeightPct','loanWeightPct','pledgePct','ltvPct'].includes(field)){fund[field]=String(value).trim()===''?NaN:Number(value);}
  else return;
  render();
}
app.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.matches('[data-text-field="scenarioName"]')){current.scenarioName=String(t.value).slice(0,60);render();return;}
  if(t.matches('[data-field]')){changeField(t.dataset.field,t.value);return;}
  if(t.matches('[data-fund-id]')){changeFund(t.dataset.fundId,t.dataset.fundField,t.value);return;}
  if(t.id==='save-slot')saveSlot=t.value;
  if(t.id==='research-portfolio'){study.portfolio=t.value;render();return;}
  if(t.id==='research-loan'){study.loan=Number(t.value);render();return;}
  if(t.id==='research-rf'){study.rf=Number(t.value);render();return;}
  if(t.matches('[data-v03]')){v03Settings[t.dataset.v03]=t.dataset.v03==='rfPct'?Number(t.value):t.value;render();return;}
  if(t.matches('[data-survival]')){
    const key=t.dataset.survival;
    const value=['shockPct','shockMonth','unemploymentMonths','rateHikePct','horizonMonths'].includes(key)?Number(t.value):
      key==='prefund'?t.value==='yes':t.value;
    const next={...survivalSettings,[key]:value};
    try{
      survivalSettings=window.LPOSSurvival.validate(next);
      localStorage.setItem('lpos-v05-survival-controls',JSON.stringify(survivalSettings));
      render();
    }catch(err){toast('生存參數無效：'+String(err.message||err));render()}
    return;
  }
});
app.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.nav){tab=t.dataset.nav;
    if(typeof history!=='undefined'&&history.replaceState)history.replaceState(null,'','#'+tab);
    render();window.scrollTo({top:0,behavior:'auto'});return;}
  const act=t.dataset.action;if(!act)return;
  if(act==='decision-run'){void runDecision();return;}
  if(act==='goto-portfolio'){tab='portfolio';render();return;}
  if(act==='goto-financing'){tab='financing';render();return;}
  if(act==='survival-sample'){
    const a=makeFund('006208',60,60);a.pledgePct=100;a.ltvPct=60;
    const b=makeFund('00685L',40,40);b.pledgePct=0;b.ltvPct=0;
    current.funds=[a,b];current.scenarioName='整合範例：006208／00685L';
    render();toast('已切換至可進行逐日研究的 ETF 示例，資金與融資條件不變');return;
  }
  if(act==='survival-run'||act==='survival-cases'){void runSurvival(act==='survival-cases'?'cases':'solo');return;}
  if(act==='survival-export'||act==='survival-export-csv'){
    if(survivalState.status!=='ready'||survivalState.stamp!==survivalStamp())
      return toast('請先重新計算目前設定的生存研究');
    const q=survivalState.result;
    if(act==='survival-export-csv'){
      const head='date,equity,cash,debt,receivable,restricted_cash,maintenance_pct,accrued_interest';
      const data=q.ledger.map(x=>[x.date,x.equity,x.cash,x.debt,x.receivable,x.restrictedCash,x.maintenancePct??'',x.accruedInterest].join(','));
      download('LPOS_integrated_survival.csv','\ufeff'+head+'\n'+data.join('\n')+'\n','text/csv');
    }else{
      download('LPOS_integrated_survival.json',JSON.stringify({
        version:'LPOS Web V0.6',scenario:current,controls:survivalSettings,
        researchGrade:'TWSE-derived adjusted price proxy, NOT verified ETF total returns',
        result:q,cases:survivalState.cases},null,2));
    }return;
  }
  if(act==='export-workspace'){
    download('LPOS_integrated_workspace.json',JSON.stringify({
      version:'LPOS Web V0.6',scenario:current,savedScenarios:saved,
      backtestSettings:v03Settings,survivalSettings,
      backtest:v03State.status==='ready'&&v03State.stamp===backtestStamp()?v03State.result:null,
      survival:survivalState.status==='ready'&&survivalState.stamp===survivalStamp()?survivalState.result:null,
      caveats:'Adjusted-price research. No certified total returns, broker credit approval, or actual forced liquidation.'},null,2));
    toast('已匯出整合研究設定與目前有效的結果');return;
  }
  if(act==='v03-goto-compare'){tab='compare';render();return;}
  if(act==='v03-sample'){
    const a=makeFund('006208',60,60);a.pledgePct=100;a.ltvPct=60;
    const b=makeFund('00685L',40,40);b.pledgePct=0;b.ltvPct=0;
    current.funds=[a,b];current.scenarioName='可回測示範：006208 60%／00685L 40%';
    render();toast('已套用有逐日資料的雙 ETF 配置，可按「計算目前組合」');return;
  }
  if(act==='v03-run'){void runV03('solo');return;}
  if(act==='v03-compare'){void runV03('comparison');return;}
  if(act==='v03-export-csv'){
    if(v03State.status!=='ready'||v03State.kind!=='solo'||v03State.stamp!==backtestStamp()||!v03State.result)return toast('請先重新執行目前組合回測');
    download('LPOS_V0.3_daily_path.csv',backtestCsv(v03State.result),'text/csv');return;
  }
  if(act==='v03-export-json'||act==='v03-export-comparison'){
    if(v03State.status!=='ready'||v03State.stamp!==backtestStamp())return toast('請先執行符合目前設定的回測');
    const output=act==='v03-export-comparison'?v03State.comparison:v03State.result;
    if(!output)return toast('沒有相應的研究結果');
    download('LPOS_V0.3_'+(act==='v03-export-comparison'?'comparison':'scenario')+'.json',JSON.stringify({research:output,disclosure:'Price-adjusted proxy only. No total returns, margin execution contracts, or T+2 settlement validation.'},null,2));return;
  }

  if(act==='download-research'){
    if(!reference)return toast('研究快照尚未載入');
    const row=lookupResearchCase(reference,study.portfolio,study.loan);
    if(!row)return toast('目前沒有這組已驗證策略');
    download(`LPOS_V3.0_snapshot_${study.portfolio}_${study.loan}.json`,JSON.stringify({webVersion:'0.2.0',researchVersion:'V3.0',sourceGrade:reference.sourceGrade,marketData:reference.marketData,controls:reference.controls,model:reference.engine,case:row,sourceAudit:reference.sourceAudit,limitations:reference.limitations},null,2));
    toast('已匯出可追溯的 Python 研究快照');return;
  }
  if(act==='normalize-own'||act==='normalize-loan'){
    current.funds=normalizeFunds(current.funds,act==='normalize-own'?'ownWeightPct':'loanWeightPct');render();return;
  }
  if(act==='remove-fund'){
    if(current.funds.length===1)return toast('至少保留一檔投資標的');
    current.funds=current.funds.filter(f=>f.id!==t.dataset.id);
    render();toast('已刪除標的；請檢查兩組權重是否合計為 100%');return;
  }
  if(act==='add-catalog'||act==='add-custom'){
    if(current.funds.length>=MAX_ASSETS)return toast(`最多可加入 ${MAX_ASSETS} 檔標的`);
    let symbol='';if(act==='add-catalog')symbol=document.getElementById('catalog-picker')?.value??'';
    else symbol=(document.getElementById('custom-symbol')?.value??'').trim().toUpperCase();
    if(!/^[A-Z0-9._-]{1,16}$/.test(symbol))return toast('請輸入有效 ETF 代號（英數與 ._-）');
    if(current.funds.some(f=>f.symbol===symbol))return toast(`${symbol} 已在組合中`);
    current.funds.push(makeFund(symbol,0,0));render();toast(`已加入 ${symbol}，請調整配置權重`);return;
  }
  if(act==='reset'){
    if(window.confirm('確定回復預設情境？瀏覽器儲存的 A/B/C 方案仍會保留。')){
      current=defaultScenario();render();toast('已回復整合研究基準情境');}return;
  }
  if(act==='export'){
    try{download('LPOS_Portfolio_Lab_V0.3_'+new Date().toISOString().slice(0,10)+'.json',serializeScenario(current));toast('已匯出 JSON 情境設定');}
    catch(err){toast(err.message)}return;
  }
  if(act==='import'){
    if(!filePicker){filePicker=document.createElement('input');filePicker.type='file';filePicker.accept='.json,application/json';filePicker.style.display='none';document.body.append(filePicker);
      filePicker.addEventListener('change',async()=>{
        const file=filePicker.files?.[0];if(!file)return;
        if(file.size>100000)return toast('檔案超過 100KB，拒絕匯入');
        try{current=validateAndParse(await file.text());render();toast('已匯入 JSON 情境設定');}
        catch(err){toast('匯入失敗：'+err.message)}filePicker.value='';});}
    filePicker.click();return;
  }
  if(act==='save-slot'){
    const r=calculateScenario(current);if(!r.valid)return toast('目前權重或參數不正確，無法儲存：'+r.errors[0]);
    saved[saveSlot]=deepCopy(current);safeSaveSlots();render();toast(`已將目前設定儲存到方案 ${saveSlot}`);return;
  }
  if(act==='load-slot'){
    if(!saved[saveSlot])return toast(`方案 ${saveSlot} 尚未儲存`);
    try{current=validateAndParse(JSON.stringify(saved[saveSlot]));render();toast(`已載入方案 ${saveSlot}`)}catch(err){toast('載入失敗：'+err.message)}return;
  }
  if(act==='clear-slot'){
    if(!saved[saveSlot])return toast(`方案 ${saveSlot} 目前是空的`);
    delete saved[saveSlot];safeSaveSlots();render();toast(`已清除方案 ${saveSlot}`);return;
  }
});

  const raw=(typeof location!=='undefined'?location.hash.slice(1):'');
