<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRStK 策略資料庫</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="site-shell header-inner"><a class="brand-pair" href="index.html" aria-label="PRStK 與 SFC.e 台灣 ETF 研究平台"><img src="assets/PRStK-Remove.png" alt="PRStK" class="brand-logo"><span class="brand-divider">|</span><img src="assets/SFC.e-removebg-preview.png" alt="SFC.e" class="brand-logo"><span class="brand-platform-name">Taiwan ETF Quantitative Research Platform</span></a><nav class="nav" aria-label="主選單"><a href="index.html">總覽</a><a href="research-lab.html">研究實驗室</a><a class="active" href="strategies.html">策略資料庫</a><a href="compare.html">策略比較</a><a href="stress-test.html">壓力測試</a><a href="report.html">研究報告</a><a href="methodology.html">資料與方法</a><a href="audit.html">研究審核</a></nav></div></header><main class="site-shell"><div class="breadcrumb"><a href="index.html">總覽</a><span>/</span><span>策略資料庫</span></div><section class="hero"><p class="eyebrow">Strategy Library</p><h1 class="display">先辨識實作狀態，再比較績效。</h1><p class="lead">策略名稱不等於驗證完成。每張卡片都保留資料型態、限制與模型版本。</p></section><section class="section"><div class="metric-grid"><div class="metric"><small>可正式比較</small><strong id="verified">—</strong></div><div class="metric"><small>部分實作／實驗</small><strong id="experimental">—</strong></div><div class="metric"><small>合成或資料限制</small><strong id="limited">—</strong></div><div class="metric"><small>策略總數</small><strong id="total">—</strong></div></div></section><section class="section"><div id="cards" class="grid-3"></div></section><footer class="footer">@2026 PRStK Lab &amp; SFC.e. | All right reserved.</footer></main><script type="module">const catalog=await fetch('data/strategy-catalog.json').then(r=>r.json());const state={verified:0,experimental:0,limited:0};const label={verified:'正式比較',partially_implemented:'部分實作',experimental:'實驗性',synthetic_only:'僅合成資料',data_unavailable:'資料不可用',not_implemented:'尚未實作'};catalog.strategies.forEach(s=>{if(s.implementation_status==='verified')state.verified++;else if(s.implementation_status==='experimental')state.experimental++;else state.limited++;const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="section-title"><span class="status ${s.implementation_status==='verified'?'good':'warn'}">${label[s.implementation_status]}</span><span class="chip">${s.data_type}</span></div><h3>${s.display_name}</h3><p>${s.category} · 模型 ${s.model_version}</p><details style="margin-top:14px"><summary>查看限制與資料需求</summary><p style="margin-top:10px">資料：${s.required_data.join('、')}<br>起始日：${s.supported_start_date||'依資料可用性'}<br>${s.known_limitations.join('<br>')}</p></details><a class="button secondary" style="display:block;text-align:center;margin-top:14px" href="research-lab.html?strategy=${s.strategy_id}">帶入研究實驗室</a>`;document.querySelector('#cards').appendChild(el)});document.querySelector('#verified').textContent=state.verified;document.querySelector('#experimental').textContent=state.experimental;document.querySelector('#limited').textContent=state.limited;document.querySelector('#total').textContent=catalog.strategies.length;</script></body></html>
